version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      surgio:
        patterns:
          - "surgio*"
      dev-deps:
        dependency-type: "development"
    # 以下全部是 surgio@3.19 → @oclif/plugin-plugins@3.x 内嵌 npm@9 的传递依赖,
    # semver 锁死无法在范围内修复 (Dependabot 每次尝试开安全 PR 都会引擎失败刷红 Actions)。
    # 判定: 构建期已知风险, 不进分发产物 — 详见 AGENTS.md「架构已知问题」。
    # surgio 升级到跟进 oclif v5 的版本后, 删除此 ignore 块。
    #
    # 2026-09-11: js-yaml 已移出此块 — 它不属于上面这类。补丁版 3.15.2 / 4.3.2 都落在
    # 现有 semver 范围内 (^3.14.1 / ^4.3.0), 可正常修复; 而裸 dependency-name 不写 versions
    # 会被解释为 ">= 0", 对 security update 同样生效, 结果是告警永远关不掉, 且每次安全更新
    # 任务都以 all_versions_ignored + exit 1 收场, 反而成为 Actions 刷红源。
    # 如需再加 ignore, 必须写 versions 限定范围。
    ignore:
      - dependency-name: "tar"
      - dependency-name: "sigstore"
      - dependency-name: "minimatch"
      - dependency-name: "brace-expansion"
      - dependency-name: "glob"
      - dependency-name: "ip"
      - dependency-name: "got"
      - dependency-name: "@tootallnate/once"
      - dependency-name: "cross-spawn"
      - dependency-name: "diff"
      # 2026-09-04: decode-uri-component 经 surgio@3.19 → query-string@7.1.3 锁死 ^0.2.2,
      # 修复版 0.5.0 不兼容, Dependabot 安全 PR 必然 security_update_not_possible (run 33474329435)。
      # 同上, surgio 升级后删除。
      - dependency-name: "decode-uri-component"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"