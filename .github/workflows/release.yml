# 版本化发布: 推送 v* tag 时将 Profile/Loon.lcf 快照发布到 GitHub Releases
# 用途: 提供可锁定版本回滚；仓库无备用 CDN，Release 仅是版本快照
# 用法: git tag v8.9.1 && git push origin v8.9.1
name: Release Profile

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Publish Loon.lcf snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 无签名 tag 流程 (git tag vX.Y.Z && git push): 内部快照分发, 不校验签名
          if grep -niE '(^|,) *(password|uuid|bob|encryption) *=' Profile/Loon.lcf; then
            echo "::error::Loon.lcf 含订阅凭据 — 禁止发布"
            exit 1
          fi
          node -e 'const fs=require("fs");const lines=fs.readFileSync("Profile/Loon.lcf","utf8").split("\n");let active=false;for(const raw of lines){const t=raw.trim();if(t==="[Proxy]"){active=true;continue}if(active&&t.startsWith("["))break;if(active&&t&&!t.startsWith("#")){console.error("Loon.lcf [Proxy] 含静态节点: "+t);process.exit(1)}}'
          gh release create "$TAG" --generate-notes \
            "Profile/Loon.lcf#Loon.lcf (完整配置)"
