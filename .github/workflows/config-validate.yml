name: Config Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 只读校验: 显式声明最小权限, 不依赖仓库默认 token 权限
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ── 1. Plugin 元信息检查 ──
      - name: Check plugin metadata
        run: |
          echo "## Plugin Metadata Check" >> $GITHUB_STEP_SUMMARY
          MISSING=0
          # 自维护插件: 严格要求 #!name + #!version
          for f in Plugin/*.plugin; do
            name=$(grep -m1 '#!name=' "$f" | sed 's/#!name=//')
            ver=$(grep -m1 '#!version=' "$f" | sed 's/#!version=//')
            desc=$(grep -m1 '#!desc=' "$f" | sed 's/#!desc=//')
            if [ -z "$name" ]; then echo "❌ $f: missing #!name"; MISSING=$((MISSING+1)); fi
            if [ -z "$ver" ]; then echo "⚠️ $f: missing #!version"; MISSING=$((MISSING+1)); fi
            if [ -z "$desc" ]; then echo "⚠️ $f: missing #!desc"; fi
            echo "| $(basename $f) | ${name:-UNKNOWN} | v${ver:-?} | OK |" >> $GITHUB_STEP_SUMMARY
          done
          # Kelee/ 为 vendored 第三方插件, 元信息仅警告不阻断
          for f in Kelee/*.plugin; do
            name=$(grep -m1 '#!name=' "$f" | sed 's/#!name=//')
            ver=$(grep -m1 '#!version=' "$f" | sed 's/#!version=//')
            if [ -z "$ver" ]; then echo "ℹ️ $f: vendored 插件无 #!version (不阻断)"; fi
            echo "| $(basename $f) | ${name:-UNKNOWN} | v${ver:-?} (vendored) | OK |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          exit $MISSING

      # ── 2. Script-path URL 可达性检查 ──
      - name: Check script-path URLs (lightweight)
        run: |
          echo "## Script-Path URL Check" >> $GITHUB_STEP_SUMMARY
          # 2026-08-29 审计修复 (两处绕过面):
          # 1) `script-path = URL` 带空格写法曾整体逃逸检查 (sub-store.plugin 即此写法)
          # 2) -i + 小写归一: 原正则大小写敏感, HTTPS://evil.com 整行不进入提取集合即逃逸白名单
          grep -rhE 'script-path[[:space:]]*=' Plugin/*.plugin Kelee/*.plugin 2>/dev/null | \
            grep -oiP 'https?://[^"'\'',]+' | tr '[:upper:]' '[:lower:]' | sort -u > /tmp/urls.txt
          # 域白名单检查: script-path 只允许指向受信分发域 (防本地壳投毒, 与 mirror 门禁 4 对齐)
          BAD=$(grep -vE '^(https?://(github\.com|raw\.githubusercontent\.com|gist\.githubusercontent\.com|ws\.wenn\.in|3kaiu\.github\.io|kelee\.one|jsdelivr\.net|unpkg\.com)/)' /tmp/urls.txt || true)
          if [ -n "$BAD" ]; then
            echo "❌ 白名单外 script-path 域:"
            echo "$BAD"
            echo "Failures: 99" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          FAIL=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -fsSL -m 15 -o /dev/null -w "%{http_code}" "$url" || echo "FAIL")
            if [ "$code" = "FAIL" ] || [ "$code" = "000" ]; then
              echo "❌ $url → $code"
              FAIL=$((FAIL+1))
            else
              echo "✅ $url → $code"
            fi
          done < /tmp/urls.txt
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Failures: $FAIL" >> $GITHUB_STEP_SUMMARY
          exit $FAIL

      # ── 3. Loon 规则覆盖检查 ──
      - name: Check Loon rule coverage
        run: |
          echo "## Loon Rule Coverage" >> $GITHUB_STEP_SUMMARY
          MISSING=0
          # 检查策略组路由是否完整 (Global.list 未完整覆盖的域名)
          # v7.8: 策略组拆分后, twittercdn/tdesktop 走 Social, steamcdn 走 Gaming, onedrive/wikimedia 走 Developer
          for domain in twittercdn.com tdesktop.com steamcdn-a.akamaihd.net onedrive.live.com wikimediafoundation.org; do
            in_loon=$(grep -cE "DOMAIN-SUFFIX, $domain, (Proxy|Streaming|Social|Developer|AI|Gaming)" Profile/Loon.lcf)
            if [ "$in_loon" -eq 0 ]; then echo "⚠️ Loon 缺少 $domain 代理规则"; MISSING=$((MISSING+1)); fi
          done
          # 检查 Proxy 组过滤一致性 (v8.9: ".*" → MainNodes, 排除 geonode-* 免费代理)
          loon_regex=$(grep "Proxy = url-test" Profile/Loon.lcf | grep -o 'MainNodes')
          geonode_excluded=$(grep "MainNodes = NameRegex" Profile/Loon.lcf | grep -Fc 'geonode')
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Loon Proxy filter | $loon_regex |" >> $GITHUB_STEP_SUMMARY
          echo "| Free proxies excluded from main pool | $geonode_excluded |" >> $GITHUB_STEP_SUMMARY
          if [ "$loon_regex" != "MainNodes" ] || [ "$geonode_excluded" -eq 0 ]; then
            echo "⚠️ Loon Proxy 组过滤非预期 (需 MainNodes 且排除 geonode)" >> $GITHUB_STEP_SUMMARY
            MISSING=$((MISSING+1))
          fi
          echo "| Missing rules | $MISSING |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          exit $MISSING

      # ── 4. 银行域名 MitM 冲突检测 ──
      - name: Bank MitM conflict detection
        run: |
          echo "## Bank MitM Conflict Check" >> $GITHUB_STEP_SUMMARY
          # 提取银行负向排除域名列表
          loon_banks=$(grep -oP '(?<=, )-\*\.\w+\.(com|cn)' Profile/Loon.lcf | grep -v 'apple\|icloud' | sed 's/-\*\.//' | sort)
          # 对比配置数量
          loon_count=$(echo "$loon_banks" | wc -l)
          echo "| Config | Bank excludes |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Loon | $loon_count |" >> $GITHUB_STEP_SUMMARY
          echo "✅ 银行域名排除清单已就绪 ($loon_count 个)" >> $GITHUB_STEP_SUMMARY

      # ── 5. MitM hostname 正包含统计 ──
      - name: MitM hostname inventory
        run: |
          echo "## MitM Hostname Inventory" >> $GITHUB_STEP_SUMMARY
          # 提取 Loon.lcf 的 hostname 行中所有正向域名（非 - 开头）
          loon_hostname_line=$(grep '^hostname = ' Profile/Loon.lcf)
          # 提取正向域名（逗号分隔，去除前导空格，过滤 - 开头的负向排除）
          echo "$loon_hostname_line" | sed 's/^hostname = //' | tr ',' '\n' | sed 's/^ //' | grep -v '^-' | sort -u > /tmp/loon_hostnames.txt
          loon_count=$(wc -l < /tmp/loon_hostnames.txt)
          echo "| Config | Positive hostnames |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Loon | $loon_count |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ── 5b. MitM 孤儿域校验 (最小范围原则) ──
      # 本地插件/主配置的正包含 hostname 须被至少一条 rewrite/script 规则消费,
      # 无消费 = 纯解密无收益 (扩大证书暴露面)。bundle 型 (iRingo/DualSubs) 与
      # 通配设计 (startup-adblock 的 ad.*/splash.*/flash.*) 已纳入豁免, 仅报告不阻断。
      - name: MitM orphan hostname check (local)
        run: |
          echo "## MitM Orphan Hostname Check (Local)" >> $GITHUB_STEP_SUMMARY
          node tools/mitm-orphan-check.mjs --local 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          # 本地模式严格阻断 (孤儿 = 解密面扩张), 但豁免已声明的 bundle/黑盒/通配域
          exit ${PIPESTATUS[0]}

      # ── 5c. 插件段结构与规则语法检查 (2026-08 新增) ──
      # 防合并/批量生成引入坏规则 (段错 / Rule 类型错 / Rewrite 动作缺失):
      # 校验 Plugin/ 与 Kelee/ 全部 .plugin, 合法重定向/条件式已豁免。
      - name: Plugin lint check
        run: |
          echo "## Plugin Lint Check" >> $GITHUB_STEP_SUMMARY
          node tools/plugin-lint-check.mjs 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

      # ── 5d. 模板↔产物一致性 (防双源漂移) ──
      # template/loon.tpl + snippet 的静态行必须完整存在于 Profile/Loon.lcf (反向同理)。
      # 根因 (2026-08 审计): surgio 需 provider/ 目录 (本地/CI 无 → 生成失败),
      # 产物实为手动维护 → 模板改动易遗忘同步。此检查保证任一方向改动都会在 CI 暴露。
      - name: Template-product sync check
        run: |
          echo "## Template ↔ Product Sync" >> $GITHUB_STEP_SUMMARY
          node tools/tpl-sync-check.mjs 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

      # ── 6. HTTPDNS Rewrite 检查 ──
      - name: HTTPDNS rewrite check
        run: |
          echo "## HTTPDNS Rewrite" >> $GITHUB_STEP_SUMMARY
          # 统计 Loon [Rewrite] 段中以 /d/ 结尾的 HTTPDNS reject 规则数 (旧语法, 字面匹配转义形式)
          loon_httpdns=$(grep -Fc '\/d reject-200' Profile/Loon.lcf || echo 0)
          echo "| Config | HTTPDNS rewrite count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Loon | $loon_httpdns |" >> $GITHUB_STEP_SUMMARY
          if [ "$loon_httpdns" -lt 5 ]; then
            echo "⚠️ Loon HTTPDNS rewrite 数量异常: $loon_httpdns 条" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Loon HTTPDNS rewrite: $loon_httpdns 条" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # ── 7. 主配置版本号一致性 ──
      - name: Check version consistency
        run: |
          echo "## Version Consistency" >> $GITHUB_STEP_SUMMARY
          loon_ver=$(grep -oP 'v\d+\.\d+' Profile/Loon.lcf | head -1)
          plugin_vers=$(grep -rh '#!version=' Plugin/*.plugin Kelee/*.plugin | sed 's/#!version=//' | sort -u | tr '\n' ' ')
          echo "| Config | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Loon.lcf | $loon_ver |" >> $GITHUB_STEP_SUMMARY
          echo "✅ 版本一致: $loon_ver" >> $GITHUB_STEP_SUMMARY

      # ── 8. Qidian 内嵌引擎完整性校验 ──
      - name: Qidian engine integrity check
        run: |
          echo "## Qidian Engine Integrity" >> $GITHUB_STEP_SUMMARY
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const s = fs.readFileSync("Scripts/Qidian.js", "utf8");
            const manifest = JSON.parse(fs.readFileSync("Scripts/ENGINE-MANIFEST.json", "utf8"));
            const start = manifest.integrity.blob_start_marker;
            const endMark = manifest.integrity.blob_end_marker;
            const i = s.indexOf(start), j = s.indexOf(endMark);
            if (i < 0 || j < 0) { console.log("❌ 引擎 blob marker 未找到"); process.exit(1); }
            const blob = s.slice(i, j + endMark.length);
            const h = crypto.createHash("sha256").update(blob).digest("hex");
            const pm = blob.match(/[\x27"]([A-Za-z0-9+/=]{10000,})[\x27"]/);
            const ph = pm ? crypto.createHash("sha256").update(pm[1]).digest("hex") : "(未提取到)";
            console.log("| Field | Manifest | Actual |");
            console.log("|-------|----------|--------|");
            console.log("| blob sha256 | `" + manifest.integrity.embedded_blob_sha256.slice(0, 16) + "…` | `" + h.slice(0, 16) + "…` |");
            console.log("| rc4 payload sha256 | `" + manifest.integrity.rc4_payload_sha256.slice(0, 16) + "…` | `" + ph.slice(0, 16) + "…` |");
            console.log("| upstream commit | " + manifest.engine.upstream_commit_at_embed.slice(0, 10) + " | - |");
            if (h !== manifest.integrity.embedded_blob_sha256) {
              console.log("❌ 引擎 blob 哈希与 ENGINE-MANIFEST.json 不符 — 引擎已被修改但清单未更新");
              console.log("按 manifest 的 update_procedure 审查变更并更新清单后重试");
              process.exit(1);
            }
            console.log("✅ 引擎 blob 与清单一致 (upstream " + manifest.engine.upstream_commit_at_embed.slice(0, 10) + ")");
          ' 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

      # ── 9. Loon 规则顺序防遮蔽检查 ──
      - name: Loon rule-order shadowing guard
        run: |
          echo "## Loon Rule-Order Guard" >> $GITHUB_STEP_SUMMARY
          wild_line=$(grep -n '^DOMAIN-SUFFIX, googleapis\.com, Streaming' Profile/Loon.lcf | cut -d: -f1)
          wild2_line=$(grep -n '^DOMAIN-SUFFIX, google\.com, Streaming' Profile/Loon.lcf | cut -d: -f1)
          ai_glm_line=$(grep -n '^DOMAIN-SUFFIX, generativelanguage\.googleapis\.com' Profile/Loon.lcf | cut -d: -f1)
          crash_line=$(grep -n '^DOMAIN-SUFFIX, crashlytics\.googleapis\.com' Profile/Loon.lcf | cut -d: -f1)
          ads_line=$(grep -n '^DOMAIN-SUFFIX, adservice\.google\.com' Profile/Loon.lcf | cut -d: -f1)
          anl_line=$(grep -n '^DOMAIN-SUFFIX, analytics\.google\.com' Profile/Loon.lcf | cut -d: -f1)
          if [ -z "$wild_line" ] || [ -z "$wild2_line" ] || [ -z "$crash_line" ] || [ -z "$ads_line" ]; then
            echo "❌ 缺少必要规则行 (wild=$wild_line/$wild2_line crash=$crash_line ads=$ads_line)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          FAIL=0
          for wild_label in "googleapis.com:$wild_line" "google.com:$wild2_line"; do
            wname=${wild_label%%:*}; wline=${wild_label##*:}
            for anchor in "crashlytics:$crash_line" "adservice:$ads_line" "analytics:$anl_line"; do
              aname=${anchor%%:*}; aline=${anchor##*:}
              if [ -n "$aline" ] && [ "$wline" -lt "$aline" ]; then
                echo "❌ $wname 通配 (L$wline) 在 $aname (L$aline) 之前 — $aname 被遮蔽" >> $GITHUB_STEP_SUMMARY
                FAIL=1
              fi
            done
          done
          if [ "$FAIL" -eq 0 ]; then
            echo "✅ 顺序正确: Google 通配位于所有 Reject 锚点之后" >> $GITHUB_STEP_SUMMARY
          fi
          exit $FAIL

      # ── 10. 接线完整性检查 (审计修复 2026-08) ──
      # 防"写了插件/脚本但没接线"的死代码回归:
      #   每个 Plugin/*.plugin 必须被 loon.tpl 引用; 每个 Scripts/*.js 必须被引用;
      #   反向引用 (模板/插件引用的文件必须存在) 一并校验
      # ── 11. 规则顺序守卫 (2026-08-29 审计修复: 原 test/rule-order-check.js 不在 CI 也不在 npm test,
      # 且锚点已失效 → 永远失败又无人执行。现重写为守护现行拓扑, 并接入本门禁) ──
      - name: Loon rule-order guard (test/rule-order-check.js)
        run: node test/rule-order-check.js 2>&1 | tee -a $GITHUB_STEP_SUMMARY


      - name: Wiring integrity check (no dead code)
        run: |
          echo "## Wiring Integrity Check" >> $GITHUB_STEP_SUMMARY
          node test/wiring-check.js 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}
