name: Config Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 只读校验: 显式声明最小权限, 不依赖仓库默认 token 权限
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ── 1. Plugin 元信息检查 ──
      - name: Check plugin metadata
        run: |
          echo "## Plugin Metadata Check" >> $GITHUB_STEP_SUMMARY
          MISSING=0
          # 自维护插件: 严格要求 #!name + #!version
          for f in Plugin/*.plugin; do
            name=$(grep -m1 '#!name=' "$f" | sed 's/#!name=//')
            ver=$(grep -m1 '#!version=' "$f" | sed 's/#!version=//')
            desc=$(grep -m1 '#!desc=' "$f" | sed 's/#!desc=//')
            if [ -z "$name" ]; then echo "❌ $f: missing #!name"; MISSING=$((MISSING+1)); fi
            if [ -z "$ver" ]; then echo "⚠️ $f: missing #!version"; MISSING=$((MISSING+1)); fi
            if [ -z "$desc" ]; then echo "⚠️ $f: missing #!desc"; fi
            echo "| $(basename $f) | ${name:-UNKNOWN} | v${ver:-?} | OK |" >> $GITHUB_STEP_SUMMARY
          done
          # Kelee/ 为 vendored 第三方插件, 元信息仅警告不阻断
          for f in Kelee/*.plugin; do
            name=$(grep -m1 '#!name=' "$f" | sed 's/#!name=//')
            ver=$(grep -m1 '#!version=' "$f" | sed 's/#!version=//')
            if [ -z "$ver" ]; then echo "ℹ️ $f: vendored 插件无 #!version (不阻断)"; fi
            echo "| $(basename $f) | ${name:-UNKNOWN} | v${ver:-?} (vendored) | OK |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          exit $MISSING

      # ── 2. Script-path URL 可达性检查 ──
      - name: Check script-path URLs (lightweight)
        run: |
          echo "## Script-Path URL Check" >> $GITHUB_STEP_SUMMARY
          # 2026-08-29 审计修复 (两处绕过面):
          # 1) `script-path = URL` 带空格写法曾整体逃逸检查 (已移除的第三方订阅管理器插件即此写法)
          # 2) -i + 小写归一: 原正则大小写敏感, HTTPS://evil.com 整行不进入提取集合即逃逸白名单
          # 3) -i: `SCRIPT-PATH=` 大写 key 曾整体逃逸提取 (2026-09-04 对抗审计实证);
          #    Loon key 大小写语义未定, 按 fail-closed 宁可误杀注释行
          grep -rhiE 'script-path[[:space:]]*=' Plugin/*.plugin Kelee/*.plugin 2>/dev/null | \
            grep -oiP 'https?://[^"'\'',]+' | tr '[:upper:]' '[:lower:]' | sort -u > /tmp/urls.txt
          # 域白名单检查: script-path 只允许指向受信分发域 (防本地壳投毒, 与 mirror 门禁 4 对齐)
          BAD=$(grep -vE '^(https?://(github\.com|raw\.githubusercontent\.com|gist\.githubusercontent\.com|ws\.wenn\.in|3kaiu\.github\.io|kelee\.one|jsdelivr\.net|unpkg\.com)/)' /tmp/urls.txt || true)
          if [ -n "$BAD" ]; then
            echo "❌ 白名单外 script-path 域:"
            echo "$BAD"
            echo "Failures: 99" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          FAIL=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -fsSL -m 15 -o /dev/null -w "%{http_code}" "$url" || echo "FAIL")
            if [ "$code" = "FAIL" ] || [ "$code" = "000" ]; then
              echo "❌ $url → $code"
              FAIL=$((FAIL+1))
            else
              echo "✅ $url → $code"
            fi
          done < /tmp/urls.txt
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Failures: $FAIL" >> $GITHUB_STEP_SUMMARY
          exit $FAIL

      # ── 3. Loon 规则覆盖检查 ──
      - name: Check Loon rule coverage
        run: |
          echo "## Loon Rule Coverage" >> $GITHUB_STEP_SUMMARY
          MISSING=0
          # 检查策略组路由是否完整 (Global.list 未完整覆盖的域名)
          # v7.8: 策略组拆分后, twittercdn/tdesktop 走 Social, steamcdn 走 Gaming, onedrive/wikimedia 走 Developer
          for domain in twittercdn.com tdesktop.com steamcdn-a.akamaihd.net onedrive.live.com wikimediafoundation.org; do
            in_loon=$(grep -cE "DOMAIN-SUFFIX, $domain, (Proxy|Streaming|Social|Developer|AI|Gaming)" Profile/Loon.lcf)
            if [ "$in_loon" -eq 0 ]; then echo "⚠️ Loon 缺少 $domain 代理规则"; MISSING=$((MISSING+1)); fi
          done
          # 检查 Proxy 组过滤一致性 (v8.9: ".*" → MainNodes, 排除 geonode-* 免费代理)
          loon_regex=$(grep "^Proxy = url-test" Profile/Loon.lcf | grep -o 'MainNodes')
          geonode_excluded=$(grep "MainNodes = NameRegex" Profile/Loon.lcf | grep -Fc 'geonode')
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Loon Proxy filter | $loon_regex |" >> $GITHUB_STEP_SUMMARY
          echo "| Free proxies excluded from main pool | $geonode_excluded |" >> $GITHUB_STEP_SUMMARY
          if [ "$loon_regex" != "MainNodes" ] || [ "$geonode_excluded" -eq 0 ]; then
            echo "⚠️ Loon Proxy 组过滤非预期 (需 MainNodes 且排除 geonode)" >> $GITHUB_STEP_SUMMARY
            MISSING=$((MISSING+1))
          fi
          echo "| Missing rules | $MISSING |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          exit $MISSING

      # ── 4. 银行域名 MitM 冲突检测 ──
      # 2026-09-11 审计 (CI-02): 原实现**永不失败**, 有三个独立缺陷:
      #   1) 只有 print 没有断言 — 排除清单被清空也照样输出 ✅;
      #   2) `echo "$x" | wc -l` 在 $x 为空时返回 1 (echo 仍吐出一个换行),
      #      故 loon_count 恒 ≥1, 计数本身无法暴露"清单为空";
      #   3) 用 `grep -oP` (GNU PCRE) + BRE 的 '\|' 交替 — BSD/macOS grep 均不支持,
      #      该检查在本地无法复现 (与 mirror 门禁 2 同一类可移植性缺陷)。
      #   并且步骤名为 "conflict detection" 却从不检测任何冲突。
      # 现改为 POSIX 提取 + 三重断言: 清单规模下限 / 关键银行在场 / 正负向无重叠。
      - name: Bank MitM conflict detection
        run: |
          echo "## Bank MitM Conflict Check" >> $GITHUB_STEP_SUMMARY
          export LC_ALL=C   # 固定 collation, 保证 sort 与 comm 的序一致
          FAIL=0

          HOSTNAME_LINE=$(grep '^hostname = ' Profile/Loon.lcf || true)
          if [ -z "$HOSTNAME_LINE" ]; then
            echo "❌ 未找到 hostname 行 — 提取前提不成立, 本检查无法成立 (fail-closed)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # 负向排除 (以 - 开头) → 归一化域名。apple/icloud 属另一类豁免, 不计入银行/支付面。
          printf '%s\n' "$HOSTNAME_LINE" | sed 's/^hostname = //' | tr ',' '\n' \
            | sed 's/^[[:space:]]*//' | grep '^-' | sed 's/^-\*\.//; s/^-//' \
            | grep -v -e apple -e icloud | grep -v '^$' | sort -u > /tmp/bank_excludes.txt
          # 正向包含 (不以 - 开头) → 归一化域名, 用于冲突检测。
          printf '%s\n' "$HOSTNAME_LINE" | sed 's/^hostname = //' | tr ',' '\n' \
            | sed 's/^[[:space:]]*//' | grep -v '^-' | grep -v '^$' \
            | sed 's/^\*\.//' | sort -u > /tmp/pos_hostnames.txt

          BANK_COUNT=$(wc -l < /tmp/bank_excludes.txt)
          POS_COUNT=$(wc -l < /tmp/pos_hostnames.txt)

          # 断言 1: 清单规模下限 (2026-09-11 实测 47 条)。阈值 40 留出合理增删余量,
          # 但能拦住"清单被整体删除/生成物覆盖成空"这类静默回归。
          BANK_FLOOR=40
          if [ "$BANK_COUNT" -lt "$BANK_FLOOR" ]; then
            echo "❌ 银行/支付排除清单规模异常: $BANK_COUNT 条 (下限 $BANK_FLOOR)" >> $GITHUB_STEP_SUMMARY
            FAIL=1
          fi

          # 断言 2: 关键银行必须在场 (逐个点名, 不依赖总数 — 总数正常但漏掉某家同样致命)
          CRITICAL="icbc.com.cn ccb.com abchina.com bankofchina.com boc.cn bankcomm.com
                    psbc.com cmbchina.com spdb.com.cn citicbank.com cebbank.com cmbc.com.cn
                    cib.com.cn cgbchina.com.cn hxb.com.cn pingan.com unionpay.com tenpay.com
                    95516.com bankofbeijing.com.cn"
          MISSING=""
          for d in $CRITICAL; do
            grep -qxF "$d" /tmp/bank_excludes.txt || MISSING="$MISSING $d"
          done
          if [ -n "$MISSING" ]; then
            echo "❌ 关键银行未在 MitM 排除清单中:$MISSING" >> $GITHUB_STEP_SUMMARY
            FAIL=1
          fi

          # 断言 3: 正/负向不得重叠 — 这才是步骤名所指的"冲突检测"。
          # 同一域既正包含又负排除, 语义依赖客户端实现细节, 应直接删掉正包含。
          CONFLICT=$(comm -12 /tmp/pos_hostnames.txt /tmp/bank_excludes.txt)
          if [ -n "$CONFLICT" ]; then
            echo "❌ 同一域既在 MitM 正包含又在负排除 (语义冲突):" >> $GITHUB_STEP_SUMMARY
            printf '%s\n' "$CONFLICT" | sed 's/^/  - /' >> $GITHUB_STEP_SUMMARY
            FAIL=1
          fi

          echo "| Check | Value | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bank/payment MitM excludes | $BANK_COUNT | $([ "$BANK_COUNT" -ge "$BANK_FLOOR" ] && echo OK || echo FAIL) |" >> $GITHUB_STEP_SUMMARY
          echo "| Positive hostnames | $POS_COUNT | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical banks missing | ${MISSING:-none} | $([ -z "$MISSING" ] && echo OK || echo FAIL) |" >> $GITHUB_STEP_SUMMARY
          echo "| Positive/negative conflicts | $(printf '%s' "$CONFLICT" | grep -c . ) | $([ -z "$CONFLICT" ] && echo OK || echo FAIL) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL" -eq 0 ]; then
            echo "✅ 银行排除清单就绪 ($BANK_COUNT 条), 关键银行齐全, 无正负向冲突" >> $GITHUB_STEP_SUMMARY
          fi
          exit $FAIL

      # ── 5. MitM hostname 正包含统计 ──
      # 2026-09-11 审计: 本步原先同样"只打印不断言" — hostname 行被改名/删除时,
      # 原实现静默打印 "Loon | 0" 并放行, 看起来像检查通过。
      # 此处刻意**不加数量下限**: MitM 正包含变少是安全方向 (证书暴露面收缩),
      # 设下限会与合理收敛对抗。故只断言**解析活性** (行存在 + 解析出 ≥1 条)。
      - name: MitM hostname inventory
        run: |
          echo "## MitM Hostname Inventory" >> $GITHUB_STEP_SUMMARY
          # 提取 Loon.lcf 的 hostname 行中所有正向域名（非 - 开头）
          loon_hostname_line=$(grep '^hostname = ' Profile/Loon.lcf || true)
          if [ -z "$loon_hostname_line" ]; then
            echo "❌ 未找到 hostname 行 — MitM 清单解析前提不成立 (fail-closed)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          # 提取正向域名（逗号分隔，去除前导空格，过滤 - 开头的负向排除）
          echo "$loon_hostname_line" | sed 's/^hostname = //' | tr ',' '\n' | sed 's/^[[:space:]]*//' | grep -v '^-' | grep -v '^$' | sort -u > /tmp/loon_hostnames.txt
          loon_count=$(wc -l < /tmp/loon_hostnames.txt)
          if [ "$loon_count" -lt 1 ]; then
            echo "❌ hostname 行存在但未解析出任何正包含 — 解析逻辑已失效" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "| Config | Positive hostnames |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Loon | $loon_count |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ── 5b. MitM 孤儿域校验 (最小范围原则) ──
      # 本地插件/主配置的正包含 hostname 须被至少一条 rewrite/script 规则消费,
      # 无消费 = 纯解密无收益 (扩大证书暴露面)。bundle 型 (iRingo/DualSubs) 与
      # 通配设计 (startup-adblock 的 ad.*/splash.*/flash.*) 已纳入豁免, 仅报告不阻断。
      - name: MitM orphan hostname check (local)
        run: |
          echo "## MitM Orphan Hostname Check (Local)" >> $GITHUB_STEP_SUMMARY
          node tools/mitm-orphan-check.mjs --local 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          # 本地模式严格阻断 (孤儿 = 解密面扩张), 但豁免已声明的 bundle/黑盒/通配域
          exit ${PIPESTATUS[0]}

      # ── 5c. 插件段结构与规则语法检查 (2026-08 新增) ──
      # 防合并/批量生成引入坏规则 (段错 / Rule 类型错 / Rewrite 动作缺失):
      # 校验 Plugin/ 与 Kelee/ 全部 .plugin, 合法重定向/条件式已豁免。
      - name: Plugin lint check
        run: |
          echo "## Plugin Lint Check" >> $GITHUB_STEP_SUMMARY
          node tools/plugin-lint-check.mjs 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

      # ── 参数契约检查 (MOD-13 工具, 2026-09-11 深度审计 NEW-10 补接线) ──
      # `#!arguments-desc` / `[Argument]` / 规则占位符三方配对 + 死开关检测。
      # MOD-13 已写好该门禁并加了 npm script, 但**从未接入任何 workflow** —— 与 NEW-10
      # 同型的"看起来有门禁其实没有" (本轮由 tools/ 接线扫描发现)。同时已把该扫描固化进
      # test/wiring-check.js, 防止再出现第 5 个。
      - name: Argument contract check (tools/argument-contract-check.mjs)
        run: |
          echo "## Argument Contract Check" >> $GITHUB_STEP_SUMMARY
          node tools/argument-contract-check.mjs 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

      # ── src/ 反模式扫描 (2026-09-11 深度审计 NEW-12) ──
      # src/*.ts 是唯一可编辑面, 却不受任何静态检查: esbuild 只转译不校验类型,
      # 仓库刻意不引入 typescript, eslint 的 espree 又无法解析 src 里的真实 TS 语法
      # (interface/type)。故把**可机械判定**的一类缺陷 (起点锚定 + 交替组即整个模式 =
      # 裸前缀匹配, 会误伤 address/adaptive) 固化成本步。
      # 该缺陷在 src/ 里反复出现 4 次 (Kugou/Youku/AlipayMini/Feishu/LinkedIn/Twitter),
      # 每次靠人工审计发现。本步此前只有单测覆盖, 现提升为一等门禁 (PR 页面可见)。
      - name: Source antipattern check (tools/src-antipattern-check.mjs)
        run: |
          echo "## Source Antipattern Check" >> $GITHUB_STEP_SUMMARY
          node tools/src-antipattern-check.mjs 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

      # ── 5c-bis. workflow 内嵌 bash 语法检查 (2026-09-11 审计新增) ──
      # workflow 里的 bash 只有在 CI 执行到那一步时才暴露语法错误; mirror-scripts 与
      # upstream-health 都是每日定时任务, 坏掉可能数天后才被发现, 期间门禁形同虚设。
      # 本步把校验提前到 PR 阶段。零依赖 (node 内置 + 系统 bash)。
      # 边界: 只校验 bash 语法 — run 块内嵌的 node/python 代码错误与逻辑错误不在此列。
      - name: Workflow bash syntax check
        run: |
          echo "## Workflow Bash Syntax Check" >> $GITHUB_STEP_SUMMARY
          node tools/workflow-bash-check.mjs 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

      # ── 5d. 模板↔产物一致性 (防双源漂移) ──
      # template/loon.tpl + snippet 的静态行必须完整存在于 Profile/Loon.lcf (反向同理)。
      # 这是"集合比对", 保证模板的每一行都进了产物; 它**挡不住**产物里出现模板之外的
      # 内容 (例如手改 Loon.lcf 加一行)。后者由下方 artifact-idempotency job 兜底。
      # 更正 (2026-09-11 审计): 原注释称"surgio 需 provider/ 目录 (本地/CI 无 → 生成失败),
      # 产物实为手动维护" — 该前提不成立。provider/tokyo.js 随仓库提交, 本地
      # `npx surgio generate --skip-lint` 实测成功且逐字节确定 (连续两次 md5 相同)。
      # 产物此前确实是手改的, 但那是流程问题而非能力限制。
      - name: Template-product sync check
        run: |
          echo "## Template ↔ Product Sync" >> $GITHUB_STEP_SUMMARY
          node tools/tpl-sync-check.mjs 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

      # ── 6. HTTPDNS Rewrite 检查 ──
      - name: HTTPDNS rewrite check
        run: |
          echo "## HTTPDNS Rewrite" >> $GITHUB_STEP_SUMMARY
          # 统计 Loon [Rewrite] 段中以 /d/ 结尾的 HTTPDNS reject 规则数 (旧语法, 字面匹配转义形式)
          loon_httpdns=$(grep -Fc '\/d reject-200' Profile/Loon.lcf || echo 0)
          echo "| Config | HTTPDNS rewrite count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Loon | $loon_httpdns |" >> $GITHUB_STEP_SUMMARY
          if [ "$loon_httpdns" -lt 5 ]; then
            echo "⚠️ Loon HTTPDNS rewrite 数量异常: $loon_httpdns 条" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Loon HTTPDNS rewrite: $loon_httpdns 条" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # ── 7. 主配置版本号一致性 ──
      - name: Check version consistency
        run: |
          echo "## Version Consistency" >> $GITHUB_STEP_SUMMARY
          loon_ver=$(grep -oP 'v\d+\.\d+' Profile/Loon.lcf | head -1)
          plugin_vers=$(grep -rh '#!version=' Plugin/*.plugin Kelee/*.plugin | sed 's/#!version=//' | sort -u | tr '\n' ' ')
          echo "| Config | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Loon.lcf | $loon_ver |" >> $GITHUB_STEP_SUMMARY
          echo "✅ 版本一致: $loon_ver" >> $GITHUB_STEP_SUMMARY

      # ── 8. Qidian 内嵌引擎完整性校验 ──
      - name: Qidian engine integrity check
        run: |
          echo "## Qidian Engine Integrity" >> $GITHUB_STEP_SUMMARY
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const s = fs.readFileSync("Scripts/Qidian.js", "utf8");
            const manifest = JSON.parse(fs.readFileSync("Scripts/ENGINE-MANIFEST.json", "utf8"));
            const start = manifest.integrity.blob_start_marker;
            const endMark = manifest.integrity.blob_end_marker;
            const i = s.indexOf(start), j = s.indexOf(endMark);
            if (i < 0 || j < 0) { console.log("❌ 引擎 blob marker 未找到"); process.exit(1); }
            const blob = s.slice(i, j + endMark.length);
            const h = crypto.createHash("sha256").update(blob).digest("hex");
            const pm = blob.match(/[\x27"]([A-Za-z0-9+/=]{10000,})[\x27"]/);
            const ph = pm ? crypto.createHash("sha256").update(pm[1]).digest("hex") : "(未提取到)";
            console.log("| Field | Manifest | Actual |");
            console.log("|-------|----------|--------|");
            console.log("| blob sha256 | `" + manifest.integrity.embedded_blob_sha256.slice(0, 16) + "…` | `" + h.slice(0, 16) + "…` |");
            console.log("| rc4 payload sha256 | `" + manifest.integrity.rc4_payload_sha256.slice(0, 16) + "…` | `" + ph.slice(0, 16) + "…` |");
            console.log("| upstream commit | " + manifest.engine.upstream_commit_at_embed.slice(0, 10) + " | - |");
            if (h !== manifest.integrity.embedded_blob_sha256) {
              console.log("❌ 引擎 blob 哈希与 ENGINE-MANIFEST.json 不符 — 引擎已被修改但清单未更新");
              console.log("按 manifest 的 update_procedure 审查变更并更新清单后重试");
              process.exit(1);
            }
            console.log("✅ 引擎 blob 与清单一致 (upstream " + manifest.engine.upstream_commit_at_embed.slice(0, 10) + ")");
          ' 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

      # ── 8b. Mirror 清单一致性校验 (2026-09-04 对抗审计新增) ──
      # 防"改镜像文件忘同步 MANIFEST"(漂移) 与清单/磁盘分叉；
      # 注: 挡不住"文件+清单一起改"的恶意提交 — 那道防线是 mirror PR 人审。
      - name: Mirror manifest consistency check
        run: |
          echo "## Mirror Manifest Consistency" >> $GITHUB_STEP_SUMMARY
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const m = JSON.parse(fs.readFileSync("Mirror/MANIFEST.json", "utf8"));
            let bad = 0, n = 0;
            for (const [k, v] of Object.entries(m.files)) {
              n++;
              const p = "Mirror/" + k;
              if (!fs.existsSync(p)) { console.log("❌ 清单有记录但文件缺失: " + p); bad++; continue; }
              const buf = fs.readFileSync(p);
              const h = crypto.createHash("sha256").update(buf).digest("hex");
              if (h !== v.sha256 || buf.length !== v.bytes) { console.log("❌ 哈希漂移: " + p); bad++; }
            }
            console.log("MANIFEST 条目: " + n + ", 异常: " + bad);
            if (bad) { console.log("❌ 先同步 MANIFEST (sha256/bytes 从磁盘重算) 再提交"); process.exit(1); }
            console.log("✅ 清单与磁盘一致");
          ' 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

      # ── 9. Loon 规则顺序防遮蔽检查 ──
      - name: Loon rule-order shadowing guard
        run: |
          echo "## Loon Rule-Order Guard" >> $GITHUB_STEP_SUMMARY
          wild_line=$(grep -n '^DOMAIN-SUFFIX, googleapis\.com, Streaming' Profile/Loon.lcf | cut -d: -f1)
          wild2_line=$(grep -n '^DOMAIN-SUFFIX, google\.com, Streaming' Profile/Loon.lcf | cut -d: -f1)
          ai_glm_line=$(grep -n '^DOMAIN-SUFFIX, generativelanguage\.googleapis\.com' Profile/Loon.lcf | cut -d: -f1)
          crash_line=$(grep -n '^DOMAIN-SUFFIX, crashlytics\.googleapis\.com' Profile/Loon.lcf | cut -d: -f1)
          ads_line=$(grep -n '^DOMAIN-SUFFIX, adservice\.google\.com' Profile/Loon.lcf | cut -d: -f1)
          anl_line=$(grep -n '^DOMAIN-SUFFIX, analytics\.google\.com' Profile/Loon.lcf | cut -d: -f1)
          if [ -z "$wild_line" ] || [ -z "$wild2_line" ] || [ -z "$crash_line" ] || [ -z "$ads_line" ]; then
            echo "❌ 缺少必要规则行 (wild=$wild_line/$wild2_line crash=$crash_line ads=$ads_line)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          FAIL=0
          for wild_label in "googleapis.com:$wild_line" "google.com:$wild2_line"; do
            wname=${wild_label%%:*}; wline=${wild_label##*:}
            for anchor in "crashlytics:$crash_line" "adservice:$ads_line" "analytics:$anl_line"; do
              aname=${anchor%%:*}; aline=${anchor##*:}
              if [ -n "$aline" ] && [ "$wline" -lt "$aline" ]; then
                echo "❌ $wname 通配 (L$wline) 在 $aname (L$aline) 之前 — $aname 被遮蔽" >> $GITHUB_STEP_SUMMARY
                FAIL=1
              fi
            done
          done
          if [ "$FAIL" -eq 0 ]; then
            echo "✅ 顺序正确: Google 通配位于所有 Reject 锚点之后" >> $GITHUB_STEP_SUMMARY
          fi
          exit $FAIL

      # ── 9b. 规则顺序遮蔽检查 (2026-09-11 深度审计 NEW-05) ──
      # 取代 mirror-scripts 里那段硬编码 20 个关键词、且**方向反了**的 grep。
      # 对 [Remote Rule] 的**实际列表内容**求集合交集: 靠前的 Proxy 列表关键词若抢先
      # 命中靠后的 REJECT 条目, 该条目必须有本地 [Rule] REJECT 兜底, 否则判红。
      # 放在本 job (而非只在 mirror-scripts): 该检查只读 template/ + Mirror/, PR 阶段即可发现。
      # 同一步骤也在 mirror-scripts.yml 中执行, 以捕捉上游列表更新引入的新遮蔽。
      - name: Rule shadow check (tools/rule-shadow-check.mjs)
        run: |
          echo "## Rule Shadow Check" >> $GITHUB_STEP_SUMMARY
          node tools/rule-shadow-check.mjs 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

      # ── 9c. 镜像声明漂移检查 (2026-09-11 深度审计 NEW-10) ──
      # MOD-09 盲区: mirror-scripts 声明 `releases/latest/…` 而 keep_old 在 fetch 失败时
      # 静默保留旧版 → MANIFEST 记的是固定旧版本, 与声明不再一致; 只有比对"workflow 声明 URL"
      # 与 "MANIFEST source_url" 才能发现。此前 tools/mirror-drift-check.mjs 零接线 (= 无门禁),
      # 现以 --strict 接入: 出现**未登记**的漂移/从未抓取即判红 (登记表见该工具 ACCEPTED_* 表)。
      # 纯静态 (workflow 文件 + MANIFEST.json, 无网络), 故放 PR 阶段。
      - name: Mirror declaration drift check (tools/mirror-drift-check.mjs --strict)
        run: |
          echo "## Mirror Drift Check" >> $GITHUB_STEP_SUMMARY
          node tools/mirror-drift-check.mjs --strict 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

      # ── 10. 接线完整性检查 (审计修复 2026-08) ──
      # 防"写了插件/脚本但没接线"的死代码回归:
      #   每个 Plugin/*.plugin 必须被 loon.tpl 引用; 每个 Scripts/*.js 必须被引用;
      #   反向引用 (模板/插件引用的文件必须存在) 一并校验
      # ── 11. 规则顺序守卫 (2026-08-29 审计修复: 原 test/rule-order-check.js 不在 CI 也不在 npm test,
      # 且锚点已失效 → 永远失败又无人执行。现重写为守护现行拓扑, 并接入本门禁) ──
      - name: Loon rule-order guard (test/rule-order-check.js)
        run: |
          node test/rule-order-check.js 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}


      - name: Wiring integrity check (no dead code)
        run: |
          echo "## Wiring Integrity Check" >> $GITHUB_STEP_SUMMARY
          node test/wiring-check.js 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          exit ${PIPESTATUS[0]}

  # ── 产物可再生成性门禁 (2026-09-11 审计新增, ARCH-01) ──
  # 上方 validate job 全部是纯文本/grep 检查, 刻意不装依赖 (装不上也不影响它们)。
  # 本 job 需要 surgio, 故独立出来并行跑, 不拖慢快速门禁。
  #
  # 为什么需要它: tpl-sync-check 是"模板静态行 ⊆ 产物"的集合比对, 能挡住"改模板忘
  # 同步产物", 但**挡不住产物里多出模板没有的内容** (手改 Loon.lcf 加规则/改策略)。
  # 直接重新生成并断言零漂移, 是唯一能证明"产物 = f(模板)"的检查。
  #
  # 前提已实测 (2026-09-11): provider/tokyo.js 随仓库提交; SURGIO_SUBSCRIPTION_URL
  # 未配置时 provider 降级为 custom/nodeList:[]; generate 成功且逐字节确定
  # (连续两次 generate 的 md5 相同, git diff 为空)。
  #
  # 注: surgio 升级若改变输出格式, 本步会红 — 这是期望行为 (提示同步提交产物)。
  artifact-idempotency:
    name: Artifact regeneration idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate and assert zero drift
        run: |
          echo "## Artifact Regeneration Idempotency" >> $GITHUB_STEP_SUMMARY
          # 与 npm run generate 等价 (package.json: surgio generate --skip-lint)
          npx surgio generate --skip-lint
          if git diff --exit-code -- Profile/Loon.lcf; then
            echo "✅ Profile/Loon.lcf 可由 template/ 逐字节再生成 (无漂移)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Profile/Loon.lcf 与 template/ 重新生成的结果不一致" >> $GITHUB_STEP_SUMMARY
            echo "→ 本地执行 \`npm run generate\` 并提交产物; 禁止手改 Profile/Loon.lcf" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "--- 漂移内容 ---" >> $GITHUB_STEP_SUMMARY
            git diff -- Profile/Loon.lcf >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
