          mirror "https://github.com/Auraflare/DNS/releases/latest/download/Cloudflare.DNS.plugin" \
            "auraflare/Cloudflare.DNS.plugin" "Auraflare DNS / .plugin latest"

          # ═══════════════ BiliUniverse→Biliverse (哔哩哔哩功能增强, 跟随 latest) ═══════════════
          # 2026-09-18 解钉: 上游组织已迁移 BiliUniverse → Biliverse, 且 2026-09-17/18
          # 发布新版 (Enhanced v0.6.0 / Global v0.8.25 / ADBlock v0.6.27 / Redirect v0.2.24)。
          # 注意 Enhanced 资产名含上游拼写 (Biliverse.Enhanced.plugin), 旧名在 latest 下 404 —
          # dest 文件名保持 BiliBili.Enhanced.plugin 不变 (模板引用稳定), 仅 source_url 跟新名。
          mirror "https://github.com/BiliUniverse/Enhanced/releases/latest/download/Biliverse.Enhanced.plugin" \
            "biliuniverse/BiliBili.Enhanced.plugin" "Biliverse Enhanced / .plugin latest"
          mirror "https://github.com/BiliUniverse/Global/releases/latest/download/BiliBili.Global.plugin" \
            "biliuniverse/BiliBili.Global.plugin" "Biliverse Global / .plugin latest"
          mirror "https://github.com/BiliUniverse/ADBlock/releases/latest/download/BiliBili.ADBlock.plugin" \
            "biliuniverse/BiliBili.ADBlock.plugin" "Biliverse ADBlock / .plugin latest"
          mirror "https://github.com/BiliUniverse/Redirect/releases/latest/download/BiliBili.Redirect.plugin" \
            "biliuniverse/BiliBili.Redirect.plugin" "Biliverse Redirect / .plugin latest"

          # ═══════════════ BiliUniverse 传递依赖 (与插件同版本跟随) ═══════════════
          # 新版插件内嵌两类非白名单 script-path, 不收敛则门禁 4 整单拦截:
          #   1) biliverse.github.io (Pages 可变内容) /settings/mock.js — 设置页主题脚本
          #   2) NSNanoCat/PreferencePanes releases/latest (浮动) api.js/web.js — 设置页 get/set/delete
          # 三者体量小 (394K/56K/155K) 且变更低频, 镜像收敛后由哈希+PR 人审覆盖, 与主插件同等待遇。
          mirror "https://biliverse.github.io/settings/mock.js" \
            "biliuniverse/settings/mock.js" "Biliverse Pages / settings mock.js"
          mirror "https://github.com/NSNanoCat/PreferencePanes/releases/latest/download/api.js" \
            "preferencepanes/api.js" "NSNanoCat PreferencePanes / api.js latest"
          mirror "https://github.com/NSNanoCat/PreferencePanes/releases/latest/download/web.js" \
            "preferencepanes/web.js" "NSNanoCat PreferencePanes / web.js latest"

          # ── 本地补丁 (2026-09-18 解钉配套): 传递依赖重写到自建 CDN ──
          # 每日镜像后强制重写 (自愈); 补丁后断言与 DualSubs 段同哲学 (见下方 DualSubs 断言块)。
          sed -i "s|https://biliverse.github.io/settings/mock.js|https://ws.wenn.in/main/Mirror/biliuniverse/settings/mock.js|g" \
            Mirror/biliuniverse/BiliBili.*.plugin
          sed -i "s|https://github.com/NSNanoCat/PreferencePanes/releases/latest/download/api.js|https://ws.wenn.in/main/Mirror/preferencepanes/api.js|g; s|https://github.com/NSNanoCat/PreferencePanes/releases/latest/download/web.js|https://ws.wenn.in/main/Mirror/preferencepanes/web.js|g" \
            Mirror/biliuniverse/BiliBili.*.plugin
          # 断言: 补丁后不应残留 Pages 可变引用与浮动 latest。上游若新增传递依赖, 在此暴露。
          if grep -n -e "biliverse.github.io/settings/mock.js" -e "NSNanoCat/PreferencePanes/releases/latest" Mirror/biliuniverse/*.plugin; then
            echo "🚫 BiliUniverse 补丁后仍存在未收敛引用 (上游可能新增了传递依赖), 请人工核对并镜像"
            mark_fail "biliuniverse:传递依赖未收敛"
          fi

          # ── 行尾归一化: 哈希前把镜像文本文件统一为 LF ──
          # 根因 (2026-09-11 实测, Config Validation 的 Mirror manifest consistency check
          # "Mirror manifest consistency check"): .gitattributes 声明 `* text=auto eol=lf`
          # + `*.plugin text`, 故 `git add` 会把 CRLF 归一化为 LF 再写入 blob; 而下方清单是
          # **从磁盘原始字节**哈希的。上游 iRingo.News.plugin 本身是 CRLF, sed 补丁不改行尾
          # → 清单记 2349B/CRLF, committed blob 却是 2317B/LF → CI checkout 后重算必然漂移
          # (53 条里 1 条异常)。归一化后 disk == index == blob, 清单哈希恒等于 blob 哈希。
          # 附带收益: main 上该文件 blob 长期为 CRLF (违反 .gitattributes), 会让下方
          # `git rebase origin/main` 以 "local changes would be overwritten" 中止, 而
          # `git status` 因 stat 缓存反而报 clean (极具误导性) — 归一化同时消除该脆弱点。
          # 扩展名白名单须与 .gitattributes 的 text 声明一致; 白名单同时保证二进制镜像
          # (未来若加入 .png/.mmdb 等) 不会被误改 —— 新增非文本镜像时不要加入此列表。
          EOL_NORMALIZED=0
          while IFS= read -r -d '' f; do
            before=$(wc -c < "$f")
            perl -pi -e 's/\r\n/\n/g' "$f"
            after=$(wc -c < "$f")
            if [ "$before" != "$after" ]; then
              EOL_NORMALIZED=$((EOL_NORMALIZED + 1))
              echo "🔧 行尾归一化 CRLF→LF: $f (${before}B → ${after}B)"
            fi
          done < <(find Mirror -type f \
                    \( -name '*.js' -o -name '*.plugin' -o -name '*.lpx' -o -name '*.list' -o -name '*.conf' -o -name '*.json' \) \
                    ! -name 'MANIFEST.json' -print0)
          # Plugin/startup-adblock-pro.plugin 同样被 git add (见下方 "Open or update mirror PR"),
          # 且属 `*.plugin text`, 一并归一化以免重演同一类漂移。
          for f in Plugin/startup-adblock-pro.plugin; do
            [ -f "$f" ] || continue
            before=$(wc -c < "$f")
            perl -pi -e 's/\r\n/\n/g' "$f"
            after=$(wc -c < "$f")
            if [ "$before" != "$after" ]; then
              EOL_NORMALIZED=$((EOL_NORMALIZED + 1))
              echo "🔧 行尾归一化 CRLF→LF: $f (${before}B → ${after}B)"
            fi
          done
          echo "行尾归一化: $EOL_NORMALIZED 个文件由 CRLF 转为 LF"

          # ── 写出新清单 (按文件名排序) ──
          # 2026-08-29 修复 (审计 P1): sha256 在此处从磁盘重算, 不再信任 mirror() 在 cp 后立即算的值。
          # 旧时序下 sed 补丁 (AllInOne/AdvertisingScript/NSRingo) 在 mirror() 之后改写文件,
          # MANIFEST 记的是补丁前哈希 → 每个周期必然漂移 4 处 (已实测复现)。
          # 2026-09-11 补: 重算必须在**行尾归一化之后** —— 否则清单记的是 CRLF 形态而 blob 是
          # LF 形态, 同一类漂移会以 "53 条里 1 条异常" 的形式复现 (上方归一化块即为此而设)。
          # 另加孤儿删除守卫: 旧清单有、本轮 ENTRIES 无、且文件仍在仓库 → 保留并标记,
          # 防工作流清单漏项时静默删除仓库镜像文件 (GOODBYEADS 曾被镜像分支误删)。
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const entries = process.argv.slice(1).map(s => { const i = s.indexOf(":"); return [s.slice(1, i-1).trim().replace(/^"|"$/g,""), s.slice(i+1).trim()]; });
            entries.sort((a,b) => a[0].localeCompare(b[0]));
            const files = {};
            for (const [k, v] of entries) files[k] = JSON.parse(v);
            const oldPath = "Mirror/MANIFEST.json";
            if (fs.existsSync(oldPath)) {
              const oldFiles = (JSON.parse(fs.readFileSync(oldPath, "utf8")).files) || {};
              for (const [k, v] of Object.entries(oldFiles)) {
                if (files[k] || !fs.existsSync("Mirror/" + k)) continue;
                files[k] = v;
                files[k]._preserved = "not-in-workflow-coverage but file still tracked — kept to avoid silent deletion";
                console.log(`⚠️ 孤儿保留: Mirror/${k} (不在 workflow 清单但文件仍在仓库, 已保留)`);
              }
            }
            for (const [k, v] of Object.entries(files)) {
              if (fs.existsSync("Mirror/" + k)) {
                const buf = fs.readFileSync("Mirror/" + k);
                v.sha256 = crypto.createHash("sha256").update(buf).digest("hex");
                v.bytes = buf.length;
              }
            }
            const manifest = {
              "$comment": "镜像文件哈希清单 — 由 mirror-scripts.yml 维护; 变更会出现在镜像 PR 的 diff 中, 合并前请核对 source 变更是否符合预期",
              generated_at: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
              files
            };
            require("fs").writeFileSync("Mirror/MANIFEST.json", JSON.stringify(manifest, null, 2) + "\n");
          ' "${ENTRIES[@]}"

          echo ""
          echo "== Mirror Summary: $SUCCESS succeeded, $FAIL failed (gated: $GATED) =="
          echo "success=$SUCCESS" >> $GITHUB_ENV
          echo "fail=$FAIL" >> $GITHUB_ENV
          echo "gated=$GATED" >> $GITHUB_ENV
          # 失败条目名单 (单行, 逗号分隔 — $GITHUB_ENV 不接受多行值), 供 Report summary 输出注解
          echo "failed_list=$(IFS=,; echo "${FAILED_LIST[*]:-}")" >> $GITHUB_ENV

      # PR 制: 变更推送到 mirror/<date> 分支并开/更新 PR, 不再直推 main
      - name: Open or update mirror PR
        id: pr
        env:
          # 2026-09-11 修复: 原先只设 GH_TOKEN=github.token, 于是 PR 由 GITHUB_TOKEN 创建。
          # 官方文档 (triggering-a-workflow): 用 GITHUB_TOKEN 创建/更新的 PR, 其 pull_request
          # (opened/synchronize/reopened) 事件产生的 run 会进入 **approval-required** 状态,
          # 需人工点 "Approve workflows to run" 才执行。
          # 实测后果: mirror/sync 上 Script Tests / Config Validation 连续 6 天共 16 个 run
          # 全部停在 conclusion=action_required 且 jobs=0(从未启动); 而镜像 PR 的审核清单却
          # 要求 "CI 全绿" —— 该项因此永远无法满足, PR 长期显示 UNSTABLE。
          # 修法: 改用 PAT / GitHub App token 代替 GITHUB_TOKEN, pull_request run 即自动执行。
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN || github.token }}
        run: |
          # 初值 false: 本步骤的任何早期退出 (无变更) 都意味着"没有新镜像待校验",
          # verify job 据此跳过 (见 job 头的 outputs 说明)。
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          # 未配置 MIRROR_TOKEN 时显式告警, 而非静默降级 —— 静默降级正是本缺陷长期未被发现的根因。
          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::warning::secrets.MIRROR_TOKEN 未配置, 本次回退 GITHUB_TOKEN; 镜像 PR 的 CI 仍会停在 action_required 等人工批准。"
            echo "ci_token=github-token (降级)" >> $GITHUB_ENV
          else
            echo "ci_token=mirror-token" >> $GITHUB_ENV
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Mirror/ Plugin/startup-adblock-pro.plugin
          if git diff --cached --quiet; then
            echo "无变更, 跳过 PR"
            echo "pr_action=none" >> $GITHUB_ENV
            exit 0
          fi
          # 2026-08-29 修复: 原按日期建分支 + `gh pr create 2>/dev/null || echo skipped` 静默吞错,
          # 导致连续 17 天 0 个镜像 PR 创建成功 (分支都在推, 审核门禁全停摆), 且错误日志不可见。
          # 现改为固定分支 mirror/sync + rebase 最新 origin/main + 失败即红。
          BRANCH="mirror/sync"
          git checkout -B "$BRANCH"
          git commit -m "chore(mirror): 上游资源同步 ($(date +%Y-%m-%d)) — 待审核" || { echo "::error::commit failed"; exit 1; }
          git fetch origin main --quiet
          # 2026-09-11: 行尾归一化 (见上方 "行尾归一化" 块) 已消除本段原先记录的脆弱点 —
          # main 上 Mirror/iringo/iRingo.News.plugin 的 blob 曾是 CRLF (违反 .gitattributes),
          # 使本 rebase 以 "local changes would be overwritten" 中止, 而 `git status` 因 stat
          # 缓存反而报 clean。归一化后工作区与 index 逐字节一致, 该场景不再出现。
          # 历史: run 34527227034 曾命中。已验证**无效**的加固, 勿重试:
          # git checkout -- / checkout-index -f -a / stash push+pop / rebase --autostash /
          # -c merge.renormalize=true / 手工 strip CR。
          git rebase origin/main || { echo "::error::rebase onto origin/main failed"; exit 1; }
          git push -f origin "$BRANCH" || { echo "::error::push failed"; exit 1; }
          # 分支已推送 → verify job 才会对该分支跑等价于 PR CI 的门禁
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          CHANGED=$(git diff --name-only origin/main...HEAD -- Mirror/ | grep -v MANIFEST.json | wc -l)
          # 2026-09-11: printf 的**格式串**里字面量 % 必须转义为 %% —— 原先写成裸 "50%)",
          # printf 报 "%): invalid format character" 并以 exit 1 收场。后果是分支已 force-push
          # 但 PR 标题/正文永远更新不到 (表现为镜像 PR 的标题日期长期停在创建日)。
          TITLE="chore(mirror): 上游资源同步 ($(date +%Y-%m-%d))"
          BODY=$(printf '## 镜像同步 %s\n\n变更文件: %s 个 (不含 MANIFEST)\n\n```\n%s\n```\n\n### 审核清单\n- [ ] MANIFEST.json diff: 每个变更文件的 sha256 与 source_url 已核对\n- [ ] 上游变更符合预期 (非投毒/非破坏性更新)\n- [ ] `Verify mirrored branch` job 全绿 (镜像 PR 由 GITHUB_TOKEN 开出时其 PR run 会停在 action_required, 以该 job 为准)\n\n> 门禁: *.js 过 node --check 语法 / 体积下限 (绝对 200B + 相对上次抓取 50%%) / 非 HTML 错误页 / .plugin script-path 域白名单; 未过门禁的文件保留旧版\n' "$(date +%Y-%m-%d)" "$CHANGED" "$(git diff --stat origin/main...HEAD -- Mirror/)")
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            if gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"; then echo "pr_action=updated#"$EXISTING >> $GITHUB_ENV
            else echo "::error::镜像 PR #$EXISTING 更新失败 (审核门禁失效)"; exit 1; fi
          else
            if gh pr create --base main --head "$BRANCH" \
                --title "$TITLE" \
                --body "$BODY"; then echo "pr_action=created" >> $GITHUB_ENV
            else echo "::error::镜像 PR 创建失败 (审核门禁失效, 上游变更无法审核合并)"; exit 1; fi
          fi

      - name: Report summary
        if: always()
        run: |
          echo "### Mirror Scripts Report" >> $GITHUB_STEP_SUMMARY
          echo "| Date | Succeeded | Failed | Gated | PR | CI token |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----------|--------|-------|----|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| $(date +%Y-%m-%d) | ${success:-0} | ${fail:-0} | ${gated:-0} | ${pr_action:-none} | ${ci_token:-n/a} |" >> $GITHUB_STEP_SUMMARY
          if (( ${fail:-0} > 0 )); then
            echo "### ⚠️ Some mirrors failed or were gated" >> $GITHUB_STEP_SUMMARY
            echo "Check run logs for details. 被门禁拦截的文件保留旧版, 不影响分发。" >> $GITHUB_STEP_SUMMARY
            # 2026-09-11 深度审计 NEW-11: 注解 (annotation) 才会出现在 PR 的 Files changed / Checks
            # 视图; step summary 只在 run 详情页。名称超长时截断, 避免刷屏 (GitHub 单 run 最多展示
            # 10 条 warning, 故只列前 10 个并在末尾标注剩余数量)。
            NAMES=$(printf '%s' "${failed_list:-}" | tr ',' '\n' | sed '/^$/d')
            SHOWN=$(printf '%s\n' "$NAMES" | head -10 | paste -sd, -)
            TOTAL=$(printf '%s\n' "$NAMES" | sed '/^$/d' | wc -l | tr -d ' ')
            REST=$(( TOTAL > 10 ? TOTAL - 10 : 0 ))
            echo "::warning::镜像同步: ${fail:-0} 个文件抓取失败或被门禁拦截 (gated: ${gated:-0}) — 已保留旧版, 不影响分发。条目: ${SHOWN}$([ "$REST" -gt 0 ] && echo " …(另有 ${REST} 个, 见 run 日志)")"
          fi

  # ── 镜像分支自校验 (2026-09-18 优化审计) ──
  # 为什么需要: 镜像 PR 若由 GITHUB_TOKEN 创建, 其 pull_request run 会停在
  # conclusion=action_required (jobs=0, 需人工点 "Approve workflows to run")。
  # 实测近 100 个 run 中 14 个如此; 后果是 PR 审核清单里的"CI 全绿"永远无法满足 ——
  # PR #39 (09-11) 最终被关闭未合并、PR #42 积压 6 天 / 25 文件 (含 13 个 bundle.js
  # 与 goodbyeads 全量刷新), 镜像产出根本没进 main, 而 check:drift 用"已登记"把它
  # 变成绿色。根因: `secrets.MIRROR_TOKEN` 未配置 (上一步已 ::warning:: 提示)。
  # 正确修法确实是配置该 secret, 但"门禁依赖仓库配置"= 配置缺失即门禁静默失效, 而本仓库
  # 已两次栽在"看起来有门禁其实没有"(NEW-10 / NEW-11b)。故此处对**已推送的镜像分支**
  # 再跑一遍与 PR CI 等价的门禁: 判定对象就是镜像产出本身, 结果直接落在本 run 上,
  # 不依赖任何 secret。配置了 MIRROR_TOKEN 后本 job 仍保留 (冗余, 不是互斥)。
  verify:
    name: Verify mirrored branch
    needs: mirror
    if: needs.mirror.result == 'success' && needs.mirror.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只读: 本 job 会 npm ci (执行第三方 install 脚本), 故刻意不给写权限 ——
    # 与 script-tests.yml 把 attestation 拆出 npm ci 同一供应链理由。
    permissions:
      contents: read
    steps:
      - name: Checkout mirror branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: mirror/sync

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # config-validate 的 Mirror manifest consistency check 等价物: 清单由 workflow 自己生成, 故必须在镜像侧复核。
      # 无此步时, MANIFEST 里任何一个手滑/半截写入的 sha256 都会直接进 main。
      - name: Gate — MANIFEST hash/bytes vs disk
        run: |
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            const m = JSON.parse(fs.readFileSync("Mirror/MANIFEST.json", "utf8"));
            let bad = 0;
            for (const [k, v] of Object.entries(m.files)) {
              const p = path.join("Mirror", k);
              if (!fs.existsSync(p)) { console.log("::error::MANIFEST 条目文件缺失: " + k); bad++; continue; }
              const buf = fs.readFileSync(p);
              const sha = crypto.createHash("sha256").update(buf).digest("hex");
              if (sha !== v.sha256 || buf.length !== v.bytes) {
                console.log("::error::MANIFEST hash/bytes 不符: " + k); bad++;
              }
            }
            if (bad > 0) process.exit(1);
            console.log("✅ MANIFEST 逐条复核: " + Object.keys(m.files).length + " 条 hash/bytes 与磁盘一致");
          '

      # 与 PR CI (Script Tests + Config Validation) 等价的门禁集合。
      # 注意 check:all 里含 check:drift --strict: 若本轮有抓取失败 (keep_old) 造成漂移,
      # 这里就会红 —— 这是刻意的, 漂移应当被看见而不是靠 ACCEPTED_* 表登记掉。
      - name: Gate — build drift / lint / tests / checks / generate idempotency
        run: |
          npm ci --no-audit --no-fund
          npm run build
          if ! git diff --exit-code -- Scripts/; then
            echo "::error::镜像改动导致 Scripts/ 产物漂移 (镜像不碰 src/, 不该发生)"; exit 1
          fi
          npm run lint
          node test/run-tests.js
          node test/rule-order-check.js
          node test/wiring-check.js
          npm run check:all
          npm run generate
          if ! git diff --exit-code -- Profile/Loon.lcf; then
            echo "::error::surgio 生成结果与仓库 Loon.lcf 不一致 (产物漂移)"; exit 1
          fi
          echo "✅ 镜像分支通过全部门禁 (与 PR CI 等价)"

