name: Mirror External Scripts

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [mirror]


permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 安全改造 (2026-07 审计):
      # 1. 写入前门禁: *.js 过 node --check 语法 / 体积≥200B / 非 HTML 错误页 — 任一不过保留旧文件
      # 2. MANIFEST.json: 每个镜像文件记录 source_url + sha256 + 抓取时间, 变更在 PR diff 中高亮
      # 3. PR 制: 不再直推 main — 推送到 mirror/<date> 分支并开/更新 PR, 人工审 diff 后合并
      # 4. 覆盖范围: 脚本 + 规则列表 + rewrite 模块 + NSRingo 插件 (版本固定),
      #    Profile 全部远程引用收敛到自建 CDN (ws.wenn.in/main/Mirror/...)
      - name: Mirror upstream resources (with gates)
        run: |
          SUCCESS=0
          FAIL=0
          GATED=0
          OLD_MANIFEST="Mirror/MANIFEST.json"

          # 读取旧清单中某文件的记录 (用于抓取失败时保留旧 sha)
          old_entry() {
            [ -f "$OLD_MANIFEST" ] && node -e '
              const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const e = m.files && m.files[process.argv[2]];
              if (e) console.log(JSON.stringify(e));
            ' "$OLD_MANIFEST" "$1" 2>/dev/null || true
          }

          declare -a ENTRIES

          mirror() {
            local url="$1"
            local dest="$2"
            local name="$3"
            local path="Mirror/$dest"
            mkdir -p "$(dirname "$path")"
            local tmpf; tmpf=$(mktemp /tmp/mirror.XXXXXXXX.js)
            if ! curl -fsSL -m 90 --retry 3 -A "Loon/3.3.9" "$url" -o "$tmpf"; then
              echo "❌ $name (FETCH FAILED)"
              FAIL=$((FAIL + 1))
              local oe; oe=$(old_entry "$dest"); [ -n "$oe" ] && ENTRIES+=("\"$dest\": $oe")
              rm -f "$tmpf"; return
            fi
            # ── 门禁 1: 体积下限 (防 200 状态码的 HTML 错误页/半截传输) ──
            local size; size=$(wc -c < "$tmpf")
            if [ "$size" -lt 200 ]; then
              echo "🚫 $name 门禁拦截: 体积过小 (${size}B), 保留旧版"
              GATED=$((GATED + 1)); FAIL=$((FAIL + 1))
              local oe; oe=$(old_entry "$dest"); [ -n "$oe" ] && ENTRIES+=("\"$dest\": $oe")
              rm -f "$tmpf"; return
            fi
            # ── 门禁 2: 非 HTML ──
            if head -c 200 "$tmpf" | grep -qi '<!doctype\|<html'; then
              echo "🚫 $name 门禁拦截: 内容为 HTML 错误页, 保留旧版"
              GATED=$((GATED + 1)); FAIL=$((FAIL + 1))
              local oe; oe=$(old_entry "$dest"); [ -n "$oe" ] && ENTRIES+=("\"$dest\": $oe")
              rm -f "$tmpf"; return
            fi
            # ── 门禁 3: JS 语法 (仅 .js; .list/.conf/.plugin 非 JS) ──
            case "$dest" in
              *.js)
                if ! node --check "$tmpf" 2>/dev/null; then
                  echo "🚫 $name 门禁拦截: node --check 语法错误 (可能半截下载), 保留旧版"
                  GATED=$((GATED + 1)); FAIL=$((FAIL + 1))
                  local oe; oe=$(old_entry "$dest"); [ -n "$oe" ] && ENTRIES+=("\"$dest\": $oe")
                  rm -f "$tmpf"; return
                fi
                ;;
            esac
            cp "$tmpf" "$path"
            rm -f "$tmpf"
            local sha; sha=$(sha256sum "$path" | awk '{print $1}')
            echo "✅ $name → $path (sha256:${sha:0:12}…, ${size}B)"
            SUCCESS=$((SUCCESS + 1))
            ENTRIES+=("\"$dest\": {\"source_url\": \"$url\", \"sha256\": \"$sha\", \"bytes\": $size, \"fetched_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          }

          # ═══════════════ 脚本 (执行于 MitM 上下文, 最高敏感) ═══════════════
          mirror "https://gist.githubusercontent.com/ddgksf2013/4f53b7c6083678df25fecc8ff68b52c4/raw/netease.adblock.js" \
            "netease.adblock.js" "ddgksf2013 gist / netease.adblock.js"
          mirror "https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/amdc.js" \
            "amdc.js" "ddgksf2013/Scripts / amdc.js"
          mirror "https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/applet.js" \
            "applet.js" "ddgksf2013/Scripts / applet.js"
          mirror "https://raw.githubusercontent.com/app2smile/rules/master/js/bilibili-json.js" \
            "bilibili-json.js" "app2smile / bilibili-json.js"
          mirror "https://raw.githubusercontent.com/app2smile/rules/master/js/bilibili-proto.js" \
            "bilibili-proto.js" "app2smile / bilibili-proto.js"
          mirror "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js" \
            "youtube.request.js" "Maasea / youtube.request.js"
          mirror "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js" \
            "youtube.response.js" "Maasea / youtube.response.js"

          # AllInOne 的传递性脚本依赖 (2026-08 审计): 消除 gist/raw 单点,
          # 插件内 22 条 script-path 由下方补丁重写指向自建 CDN
          mirror "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/script/startup/startup.js" \
            "scripts/startup.js" "blackmatrix7 / startup.js"
          mirror "https://gist.githubusercontent.com/blackmatrix7/f5f780d0f56b319b6ad9848fd080bb18/raw/zheye.min.js" \
            "scripts/zheye.min.js" "blackmatrix7 gist / zheye.min.js"

          # ═══════════════ 解析器脚本 (订阅解析时执行, 可见全部节点凭据) ═══════════════
          mirror "https://github.com/sub-store-org/Sub-Store/releases/latest/download/sub-store-parser.loon.min.js" \
            "rules/loon-sub-store-parser.js" "Sub-Store / sub-store-parser.loon.min.js"

          # ═══════════════ 规则列表 (blackmatrix7, Loon 格式) ═══════════════
          for n in Advertising Privacy Hijacking Epic China Global; do
            mirror "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/$n/$n.list" \
              "rules/loon-$n.list" "blackmatrix7 Loon / $n.list"
          done

          # ── Global 列表纯净度检查 (2026-08 审计) ──
          # 远端顺序已调整为 China → Global → Advertising → ... (国际流量提前终止),
          # 前提是 Global 列表不含广告/隐私/国内域 — 上游更新若引入污染立即拦截 (fail)
          GLOBAL_BAD='(doubleclick|googleadservices|googletagmanager|googlesyndication|google-analytics|app-measurement|crashlytics|appsflyer|mixpanel|segment\.io|amplitude|branch\.io|adjust\.com|kochava|sentry\.io|qq\.com|taobao|tmall|baidu\.com|163\.com|aliyun|jd\.com|bilibili|meituan|douyin)'
          if grep -E "^(DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN),.*${GLOBAL_BAD}" Mirror/rules/loon-Global.list; then
            echo "❌ Global 列表检测到广告/隐私/国内域污染 (见上) — 已拦截, 需复检远端顺序前提"
            FAIL=$((FAIL+1))
          else
            echo "✅ Global 列表纯净度检查通过: 无广告/隐私/国内域"
          fi

          # ═══════════════ Loon rewrite 插件 ═══════════════
          # 注: 插件内 script-path 传递性依赖已收敛 (2026-08), 见下方补丁;
          # 镜像消除插件文件本身 + 22 条脚本引用的全部单点
          mirror "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/Loon/AllInOne/AllInOne.plugin" \
            "rules/loon-AllInOne.plugin" "blackmatrix7 Loon / AllInOne.plugin"
          mirror "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/Loon/AdvertisingScript/AdvertisingScript.plugin" \
            "rules/loon-AdvertisingScript.plugin" "blackmatrix7 Loon / AdvertisingScript.plugin"

          # ── 本地补丁 (2026-08 审计): 上游拼写错误 m.meitun.com → m.meituan.com ──
          # 覆盖 rewrite 行 (转义形式 m\.meitun\.com) 与 MITM hostname 行 (裸形式);
          # 每日镜像后强制修正, 若上游已修复则为 no-op (自愈)
          sed -i 's/m\\.meitun\\.com/m\\.meituan\\.com/g; s/m\.meitun\.com/m\.meituan\.com/g' \
            Mirror/rules/loon-AllInOne.plugin

          # ── 本地补丁 (2026-08 审计): script-path 传递依赖收敛到自建 CDN ──
          # AllInOne (22 条) / AdvertisingScript (26 条) 内部 script-path 原直连
          # blackmatrix7 的 raw/gist (上游可删改, 单点); 改为镜像路径, 上游更新后强制重写 (自愈)
          sed -i 's|https://gist.githubusercontent.com/blackmatrix7/f5f780d0f56b319b6ad9848fd080bb18/raw/zheye.min.js|https://ws.wenn.in/main/Mirror/scripts/zheye.min.js|g; s|https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/script/startup/startup.js|https://ws.wenn.in/main/Mirror/scripts/startup.js|g' \
            Mirror/rules/loon-AllInOne.plugin Mirror/rules/loon-AdvertisingScript.plugin

          # ── 本地补丁 (2026-08-12): 国内广告 SDK 域名追加 ──
          # 上游 blackmatrix7 Loon 版 Advertising 列表仅 278 KEYWORD + 486 IP-CIDR + 14 URL-REGEX,
          # 不含国内广告 SDK (beizi/jpush统计/mmstat/ugdtimg/1rtb/66mobi/cloooud/hubcloud 等);
          # Loon 主配置 [Rule] (template/loon.tpl) 已硬拦截 (GEOIP 之前, 本地规则优先),
          # 此处同步追加列表兜底。
          # 幂等: 先删除旧追加块再追加; 推送保活: 仅统计子域, 保留 config.jpush.cn/user.jpush.cn (极光推送) 与 api.getui.com (个推推送)
          sed -i '/# === BEGIN 3kaiu 国内广告 SDK 追加 ===/,/# === END 3kaiu 国内广告 SDK 追加 ===/d' \
            Mirror/rules/loon-Advertising.list
          cat >> Mirror/rules/loon-Advertising.list <<'EOF'
          # === BEGIN 3kaiu 国内广告 SDK 追加 ===
          DOMAIN-SUFFIX,beizi.biz
          DOMAIN-SUFFIX,stats.jpush.cn
          DOMAIN-SUFFIX,gd-stats.jpush.cn
          DOMAIN-SUFFIX,mmstat.com
          DOMAIN-SUFFIX,ugdtimg.com
          DOMAIN-SUFFIX,1rtb.net
          DOMAIN-SUFFIX,66mobi.com
          DOMAIN-SUFFIX,cloooud.com
          DOMAIN-SUFFIX,hubcloud.com.cn
          DOMAIN,sdk-open-phone.getui.com
          DOMAIN,snssdk-eu.ninebot.com
          DOMAIN,snssdk-us.ninebot.com
          DOMAIN,toblog.ctobsnssdk.com
          DOMAIN,sentry-monitor-new.zdmimg.com
          DOMAIN,path.book.qq.com
          DOMAIN,ataru.qidian.com
          DOMAIN,fockrt.yuewen.com
          DOMAIN,connect.yuewen.com
          DOMAIN,upushv6.qidian.com
          # === END 3kaiu 国内广告 SDK 追加 ===
          EOF

          # ═══════════════ NSRingo bundle.js (版本固定 release 资产) ═══════════════
          # NSRingo .plugin 引用的 bundle.js; 若上游清理旧 release 会 404, 镜像消除单点
          mirror "https://github.com/NSRingo/WeatherKit/releases/download/v3.1.0/response.bundle.js" \
            "nsringo/WeatherKit-v3.1.0-response.bundle.js" "NSRingo WeatherKit / response.bundle.js v3.1.0"
          mirror "https://github.com/NSRingo/GeoServices/releases/download/v4.6.1/request.bundle.js" \
            "nsringo/GeoServices-v4.6.1-request.bundle.js" "NSRingo GeoServices / request.bundle.js v4.6.1"
          mirror "https://github.com/NSRingo/GeoServices/releases/download/v4.6.1/response.bundle.js" \
            "nsringo/GeoServices-v4.6.1-response.bundle.js" "NSRingo GeoServices / response.bundle.js v4.6.1"
          mirror "https://github.com/NSRingo/News/releases/download/v3.2.1/request.bundle.js" \
            "nsringo/News-v3.2.1-request.bundle.js" "NSRingo News / request.bundle.js v3.2.1"
          mirror "https://github.com/NSRingo/Siri/releases/download/v4.2.7/request.bundle.js" \
            "nsringo/Siri-v4.2.7-request.bundle.js" "NSRingo Siri / request.bundle.js v4.2.7"
          mirror "https://github.com/NSRingo/Siri/releases/download/v4.2.7/response.bundle.js" \
            "nsringo/Siri-v4.2.7-response.bundle.js" "NSRingo Siri / response.bundle.js v4.2.7"
          mirror "https://github.com/NSRingo/TestFlight/releases/download/v3.4.0/request.bundle.js" \
            "nsringo/TestFlight-v3.4.0-request.bundle.js" "NSRingo TestFlight / request.bundle.js v3.4.0"
          mirror "https://github.com/NSRingo/TestFlight/releases/download/v3.4.0/response.bundle.js" \
            "nsringo/TestFlight-v3.4.0-response.bundle.js" "NSRingo TestFlight / response.bundle.js v3.4.0"
          mirror "https://github.com/NSRingo/TV/releases/download/v3.4.4/request.bundle.js" \
            "nsringo/TV-v3.4.4-request.bundle.js" "NSRingo TV / request.bundle.js v3.4.4"
          mirror "https://github.com/NSRingo/TV/releases/download/v3.4.4/response.bundle.js" \
            "nsringo/TV-v3.4.4-response.bundle.js" "NSRingo TV / response.bundle.js v3.4.4"
          mirror "https://github.com/NSRingo/LocationServices/releases/download/v1.0.1/request.bundle.js" \
            "nsringo/LocationServices-v1.0.1-request.bundle.js" "NSRingo LocationServices / request.bundle.js v1.0.1"
          mirror "https://github.com/NSRingo/LocationServices/releases/download/v1.0.1/response.bundle.js" \
            "nsringo/LocationServices-v1.0.1-response.bundle.js" "NSRingo LocationServices / response.bundle.js v1.0.1"

          # ═══════════════ NSRingo Loon 插件 (版本固定, 替代 releases/latest) ═══════════════
          mirror "https://github.com/NSRingo/WeatherKit/releases/download/v3.1.0/iRingo.WeatherKit.plugin" \
            "iringo/iRingo.WeatherKit.plugin" "NSRingo / iRingo.WeatherKit.plugin v3.1.0"
          mirror "https://github.com/NSRingo/MapKit/releases/download/v4.6.1/iRingo.Maps.plugin" \
            "iringo/iRingo.Maps.plugin" "NSRingo / iRingo.Maps.plugin v4.6.1"
          mirror "https://github.com/NSRingo/News/releases/download/v3.2.1/iRingo.News.plugin" \
            "iringo/iRingo.News.plugin" "NSRingo / iRingo.News.plugin v3.2.1"
          mirror "https://github.com/NSRingo/Siri/releases/download/v4.2.7/iRingo.Siri.plugin" \
            "iringo/iRingo.Siri.plugin" "NSRingo / iRingo.Siri.plugin v4.2.7"
          mirror "https://github.com/NSRingo/Siri/releases/download/v4.2.7/iRingo.Search.plugin" \
            "iringo/iRingo.Search.plugin" "NSRingo / iRingo.Search.plugin v4.2.7"
          mirror "https://github.com/NSRingo/TestFlight/releases/download/v3.4.0/iRingo.TestFlight.plugin" \
            "iringo/iRingo.TestFlight.plugin" "NSRingo / iRingo.TestFlight.plugin v3.4.0"
          mirror "https://github.com/NSRingo/TV/releases/download/v3.4.4/iRingo.TV.plugin" \
            "iringo/iRingo.TV.plugin" "NSRingo / iRingo.TV.plugin v3.4.4"
          mirror "https://github.com/NSRingo/LocationServices/releases/download/v1.0.1/iRingo.LocationService.plugin" \
            "iringo/iRingo.LocationService.plugin" "NSRingo / iRingo.LocationService.plugin v1.0.1"

          # ═══════════════ DualSubs (双语字幕) ═══════════════
          mirror "https://github.com/DualSubs/Universal/releases/download/v1.7.5/DualSubs.Universal.plugin" \
            "dualsubs/DualSubs.Universal.plugin" "DualSubs Universal / .plugin v1.7.5"
          mirror "https://github.com/DualSubs/Universal/releases/download/v1.7.5/Composite.Subtitles.response.bundle.js" \
            "dualsubs/Composite.Subtitles.response.bundle.js" "DualSubs Universal / Composite.Subtitles.response.bundle.js v1.7.5"
          mirror "https://github.com/DualSubs/Universal/releases/download/v1.7.5/External.Lyrics.response.bundle.js" \
            "dualsubs/External.Lyrics.response.bundle.js" "DualSubs Universal / External.Lyrics.response.bundle.js v1.7.5"
          mirror "https://github.com/DualSubs/Universal/releases/download/v1.7.5/Manifest.response.bundle.js" \
            "dualsubs/Manifest.response.bundle.js" "DualSubs Universal / Manifest.response.bundle.js v1.7.5"
          mirror "https://github.com/DualSubs/Universal/releases/download/v1.7.5/Translate.response.bundle.js" \
            "dualsubs/Translate.response.bundle.js" "DualSubs Universal / Translate.response.bundle.js v1.7.5"
          mirror "https://github.com/DualSubs/YouTube/releases/download/v1.5.11/DualSubs.YouTube.plugin" \
            "dualsubs/DualSubs.YouTube.plugin" "DualSubs YouTube / .plugin v1.5.11"
          mirror "https://github.com/DualSubs/YouTube/releases/download/v1.5.11/request.bundle.js" \
            "dualsubs/DualSubs.YouTube.request.bundle.js" "DualSubs YouTube / request.bundle.js v1.5.11"
          mirror "https://github.com/DualSubs/YouTube/releases/download/v1.5.11/response.bundle.js" \
            "dualsubs/DualSubs.YouTube.response.bundle.js" "DualSubs YouTube / response.bundle.js v1.5.11"
          mirror "https://github.com/DualSubs/Netflix/releases/download/v0.5.7/DualSubs.Netflix.plugin" \
            "dualsubs/DualSubs.Netflix.plugin" "DualSubs Netflix / .plugin v0.5.7"

          # ═══════════════ Auraflare (Cloudflare 资源集成) ═══════════════
          mirror "https://raw.githubusercontent.com/Auraflare/1.1.1.1/main/modules/Cloudflare.1.1.1.1.plugin" \
            "auraflare/Cloudflare.1.1.1.1.plugin" "Auraflare 1.1.1.1 / .plugin (main)"
          mirror "https://raw.githubusercontent.com/Auraflare/1.1.1.1/main/js/1.1.1.1.request.js" \
            "auraflare/1.1.1.1.request.js" "Auraflare 1.1.1.1 / request.js (main)"
          mirror "https://raw.githubusercontent.com/Auraflare/1.1.1.1/main/js/1.1.1.1.response.js" \
            "auraflare/1.1.1.1.response.js" "Auraflare 1.1.1.1 / response.js (main)"
          mirror "https://raw.githubusercontent.com/Auraflare/1.1.1.1/main/js/1.1.1.1.panel.js" \
            "auraflare/1.1.1.1.panel.js" "Auraflare 1.1.1.1 / panel.js (main)"
          mirror "https://github.com/Auraflare/DNS/releases/download/v2.6.3/Cloudflare.DNS.plugin" \
            "auraflare/Cloudflare.DNS.plugin" "Auraflare DNS / .plugin v2.6.3"
          mirror "https://github.com/Auraflare/DNS/releases/download/v2.6.3/event.bundle.js" \
            "auraflare/event.bundle.js" "Auraflare DNS / event.bundle.js v2.6.3"

          # ═══════════════ BiliUniverse (哔哩哔哩功能增强) ═══════════════
          mirror "https://github.com/BiliUniverse/Enhanced/releases/download/v0.5.13/BiliBili.Enhanced.plugin" \
            "biliuniverse/BiliBili.Enhanced.plugin" "BiliUniverse Enhanced / .plugin v0.5.13"
          mirror "https://github.com/BiliUniverse/Enhanced/releases/download/v0.5.13/response.bundle.js" \
            "biliuniverse/BiliBili.Enhanced.response.bundle.js" "BiliUniverse Enhanced / response.bundle.js v0.5.13"
          mirror "https://github.com/BiliUniverse/Global/releases/download/v0.8.21/BiliBili.Global.plugin" \
            "biliuniverse/BiliBili.Global.plugin" "BiliUniverse Global / .plugin v0.8.21"
          mirror "https://github.com/BiliUniverse/Global/releases/download/v0.8.21/request.bundle.js" \
            "biliuniverse/BiliBili.Global.request.bundle.js" "BiliUniverse Global / request.bundle.js v0.8.21"
          mirror "https://github.com/BiliUniverse/Global/releases/download/v0.8.21/response.bundle.js" \
            "biliuniverse/BiliBili.Global.response.bundle.js" "BiliUniverse Global / response.bundle.js v0.8.21"
          mirror "https://github.com/BiliUniverse/ADBlock/releases/download/v0.6.24/BiliBili.ADBlock.plugin" \
            "biliuniverse/BiliBili.ADBlock.plugin" "BiliUniverse ADBlock / .plugin v0.6.24"
          mirror "https://github.com/BiliUniverse/ADBlock/releases/download/v0.6.24/request.bundle.js" \
            "biliuniverse/BiliBili.ADBlock.request.bundle.js" "BiliUniverse ADBlock / request.bundle.js v0.6.24"
          mirror "https://github.com/BiliUniverse/ADBlock/releases/download/v0.6.24/response.bundle.js" \
            "biliuniverse/BiliBili.ADBlock.response.bundle.js" "BiliUniverse ADBlock / response.bundle.js v0.6.24"
          mirror "https://github.com/BiliUniverse/Redirect/releases/download/v0.2.20/BiliBili.Redirect.plugin" \
            "biliuniverse/BiliBili.Redirect.plugin" "BiliUniverse Redirect / .plugin v0.2.20"
          mirror "https://github.com/BiliUniverse/Redirect/releases/download/v0.2.20/request.bundle.js" \
            "biliuniverse/BiliBili.Redirect.request.bundle.js" "BiliUniverse Redirect / request.bundle.js v0.2.20"

          # ── 写出新清单 (按文件名排序) ──
          node -e '
            const entries = process.argv.slice(1).map(s => { const i = s.indexOf(":"); return [s.slice(1, i-1).trim().replace(/^"|"$/g,""), s.slice(i+1).trim()]; });
            entries.sort((a,b) => a[0].localeCompare(b[0]));
            const files = {};
            for (const [k, v] of entries) files[k] = JSON.parse(v);
            const manifest = {
              "$comment": "镜像文件哈希清单 — 由 mirror-scripts.yml 维护; 变更会出现在镜像 PR 的 diff 中, 合并前请核对 source 变更是否符合预期",
              generated_at: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
              files
            };
            require("fs").writeFileSync("Mirror/MANIFEST.json", JSON.stringify(manifest, null, 2) + "\n");
          ' "${ENTRIES[@]}"

          echo ""
          echo "== Mirror Summary: $SUCCESS succeeded, $FAIL failed (gated: $GATED) =="
          echo "success=$SUCCESS" >> $GITHUB_ENV
          echo "fail=$FAIL" >> $GITHUB_ENV
          echo "gated=$GATED" >> $GITHUB_ENV

      # PR 制: 变更推送到 mirror/<date> 分支并开/更新 PR, 不再直推 main
      - name: Open or update mirror PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Mirror/
          if git diff --cached --quiet; then
            echo "无变更, 跳过 PR"
            echo "pr_action=none" >> $GITHUB_ENV
            # 关掉等待中的 upstream-update Issue（文件已是最新）
            STALE=$(gh issue list --label upstream-update --state open --json number --jq '.[0].number' 2>/dev/null)
            if [ -n "$STALE" ]; then
              gh issue close "$STALE" --comment "📦 镜像文件已是最新，无需更新，关闭此 Issue" 2>/dev/null || true
            fi
            exit 0
          fi
          BRANCH="mirror/$(date +%Y-%m-%d)"
          git checkout -B "$BRANCH"
          git commit -m "chore(mirror): 上游资源同步 ($(date +%Y-%m-%d)) — 待审核" || echo "commit skipped (no changes)"
          git push -f origin "$BRANCH" 2>&1 || echo "push skipped (branch exists or remote error)"
          CHANGED=$(git diff --name-only main...HEAD -- Mirror/ 2>/dev/null | grep -v MANIFEST.json | wc -l || echo 0)
          # 查找待关闭的 upstream-update Issue
          CLOSE_ISSUE=$(gh issue list --label upstream-update --state open --json number --jq '.[0].number' 2>/dev/null)
          CLOSES=""
          [ -n "$CLOSE_ISSUE" ] && CLOSES="Closes #$CLOSE_ISSUE"
          BODY=$(printf '## 镜像同步 %s\n\n变更文件: %s 个 (不含 MANIFEST)\n\n```\n%s\n```\n\n### 审核清单\n- [ ] MANIFEST.json diff: 每个变更文件的 sha256 与 source_url 已核对\n- [ ] 上游变更符合预期 (非投毒/非破坏性更新)\n- [ ] CI 全绿\n\n> 门禁: *.js 过 node --check 语法 / 体积≥200B / 非 HTML 错误页; 未过门禁的文件保留旧版\n\n%s' "$(date +%Y-%m-%d)" "$CHANGED" "$(git diff --stat main...HEAD -- Mirror/ 2>/dev/null)" "$CLOSES")
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null | grep -q .; then
            gh pr edit "$BRANCH" --add-reviewer "@copilot" --body "$BODY" 2>/dev/null || true
            echo "pr_action=updated" >> $GITHUB_ENV
          else
            gh pr create --base main --head "$BRANCH" --reviewer "@copilot" \
              --title "chore(mirror): 上游资源同步 ($(date +%Y-%m-%d))" \
              --body "$BODY" 2>/dev/null || echo "pr creation skipped"
            echo "pr_action=created" >> $GITHUB_ENV
          fi

      - name: Report summary
        if: always()
        run: |
          echo "### Mirror Scripts Report" >> $GITHUB_STEP_SUMMARY
          echo "| Date | Succeeded | Failed | Gated | PR |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----------|--------|-------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| $(date +%Y-%m-%d) | ${success:-0} | ${fail:-0} | ${gated:-0} | ${pr_action:-none} |" >> $GITHUB_STEP_SUMMARY
          if (( ${fail:-0} > 0 )); then
            echo "### ⚠️ Some mirrors failed or were gated" >> $GITHUB_STEP_SUMMARY
            echo "Check run logs for details. 被门禁拦截的文件保留旧版, 不影响分发。" >> $GITHUB_STEP_SUMMARY
          fi
