name: Mirror External Scripts

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [mirror]

# 2026-08-29 审计: workflow_dispatch 手动连点或与 schedule 撞车时,
# 两个 run 会对同一天分支互相 force-push / 重复开 PR。串行化 (不取消在跑的: 镜像需要完整跑完)。
concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 供 verify job 判断本轮是否真的推送了镜像分支: 无变更时本 job 会在
    # "Open or update mirror PR" 里提前 exit 0, 此时分支停在上一轮状态, 不该再校验。
    outputs:
      pushed: ${{ steps.pr.outputs.pushed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 见 "Open or update mirror PR" 步骤的说明:必须用非 GITHUB_TOKEN 凭据, 否则本工作流
          # 开出的 PR 其 pull_request run 会停在 action_required。persist-credentials 默认 true,
          # 该 token 会被写进 .git/config, 供后续 git fetch/push 使用。
          token: ${{ secrets.MIRROR_TOKEN || github.token }}

      # 安全改造 (2026-07 审计):
      # 1. 写入前门禁: *.js 过 node --check 语法 / 体积下限 (绝对 200B + 相对上次 50%) /
      #    非 HTML 错误页 / .plugin 内 script-path 域白名单 — 任一不过保留旧文件
      # 2. MANIFEST.json: 每个镜像文件记录 source_url + sha256 + 抓取时间, 变更在 PR diff 中高亮
      # 3. PR 制: 不再直推 main — 推送到 mirror/<date> 分支并开/更新 PR, 人工审 diff 后合并
      # 4. 覆盖范围: 脚本 + 规则列表 + rewrite 模块 + NSRingo 插件；
      #    Profile 的脚本、插件与规则引用收敛到自建 CDN，GeoIP/ASN 保持直连上游。
      - name: Mirror upstream resources (with gates)
        run: |
          SUCCESS=0
          FAIL=0
          GATED=0
          OLD_MANIFEST="Mirror/MANIFEST.json"

          # ── 旧清单体积索引 (key → upstream_bytes), 一次性导出 ──
          # 2026-09-11 审计 (CI-01): 门禁 1 的相对下限需要"上次成功抓取的**原始**体积"。
          # 必须用 upstream_bytes 而非磁盘 bytes: Advertising/AllInOne 等文件在抓取后被
          # 本地 sed 补丁撑大 (实测 loon-Advertising.list 磁盘 32842B / 上游原始 26870B,
          # 比值 0.818), 拿磁盘体积作基准会让这些文件每轮都误报。
          # 一次性导出为 TSV 是为了避免每个文件起一个 node 进程 (约 50 个文件)。
          # 兼容: 旧清单尚无 upstream_bytes 字段时回退到 bytes — 实测最坏情况
          # (Advertising.list) 比值 0.818, 距 0.5 阈值仍有 0.318 余量, 不会误杀;
          # 本轮之后 upstream_bytes 写入清单, 后续周期均为精确基准。
          # 注: 模板的 X 放在末尾 (无后缀) — GNU mktemp 接受 X 后带后缀, BSD/macOS mktemp 只认
          # 末尾的 X, 会把 'prev-sizes.XXXXXXXX.tsv' 当字面名并在第二次调用时报 File exists。
          # 本门禁必须本地可复现才能被验证, 故用两边都成立的写法。
          PREV_SIZES=$(mktemp /tmp/prev-sizes.XXXXXX)
          # 注意: node -e 是脚本求值, **顶层 `return` 非法** (SyntaxError: Illegal return
          # statement) — 必须用 if 包裹而不是提前 return。此处曾因该语法错误 + 重定向吞掉
          # stderr, 导致索引静默为空、相对下限永不生效 (门禁看起来存在实际不存在)。
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            if (fs.existsSync(p)) {
              const m = JSON.parse(fs.readFileSync(p, "utf8"));
              for (const [k, v] of Object.entries(m.files || {})) {
                const b = typeof v.upstream_bytes === "number" ? v.upstream_bytes
                        : typeof v.bytes === "number" ? v.bytes : null;
                if (b !== null) console.log(k + "\t" + b);
              }
            }
          ' "$OLD_MANIFEST" > "$PREV_SIZES"
          # 活性断言: 清单存在却导出 0 条 → 索引脚本坏了, 门禁 1 的相对下限会静默失效。
          # 宁可红, 也不要"看起来有门禁其实没有"。(首次运行无清单时跳过)
          if [ -f "$OLD_MANIFEST" ] && [ ! -s "$PREV_SIZES" ]; then
            echo "❌ 旧清单体积索引为空 (清单存在) — 门禁 1 相对下限将失效, 中止"
            exit 1
          fi

          # ── 旧清单条目索引 (dest → entry JSON), 一次性导出 ──
          # 2026-09-18 性能审计: 原 old_entry() 每次 keep_old 起一个 node 进程
          # (~50ms/次); 失败密集的 run 即数十次无谓派生。与上方 PREV_SIZES 同模式
          # (单次导出 + awk 查表); macOS bash 3.2 无关联数组, 故用 TSV (本地可复现)。
          # dest 文件名不可能含制表符 (仓库路径字符集), 含则显式失败;
          # value 取"首个制表符之后全部", 故 JSON 值内即便有制表符也不错位。
          OLD_ENTRIES=$(mktemp /tmp/old-entries.XXXXXX)
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            if (fs.existsSync(p)) {
              const m = JSON.parse(fs.readFileSync(p, "utf8"));
              for (const [k, v] of Object.entries(m.files || {})) {
                if (k.includes("\t")) { console.error("旧清单键含制表符: " + k); process.exit(1); }
                console.log(k + "\t" + JSON.stringify(v));
              }
            }
          ' "$OLD_MANIFEST" > "$OLD_ENTRIES"

          # 读取旧清单中某文件的记录 (用于抓取失败时保留旧 sha) — 查表, 无进程派生
          old_entry() {
            [ -f "$OLD_ENTRIES" ] && awk -F'\t' -v k="$1" '$1 == k { sub(/^[^\t]*\t/, ""); print; exit }' "$OLD_ENTRIES" || true
          }

          declare -a ENTRIES
          # 抓取/门禁失败时保留旧清单条目 (镜像文件回退旧版, 清单不丢记录)
          keep_old() { local oe; oe=$(old_entry "$1"); [ -n "$oe" ] && ENTRIES+=("\"$1\": $oe"); }

          # 2026-09-11 深度审计 NEW-11: 失败/被门禁拦截的条目此前只进 step summary —
          # 而 step summary 只在 workflow 详情页可见, 镜像 PR 页面上**完全看不到**。
          # 后果: FAIL>0 常年静默 (实测 7 条 NSRingo URL 漂移 + 13 条从未抓到就是这么积起来的)。
          # 现把条目名累积下来, 在 "Report summary" 步骤以 ::warning:: 注解输出 → PR 页面可见。
          # **不要**改成 exit 1: 保留旧版是设计意图 (与 keep_old 同哲学), 要去掉的只是"沉默"。
          declare -a FAILED_LIST
          mark_fail() { FAIL=$((FAIL + 1)); FAILED_LIST+=("$1"); }


          mirror() {
            local url="$1"
            local dest="$2"
            local name="$3"
            local path="Mirror/$dest"
            mkdir -p "$(dirname "$path")"
            local tmpf; tmpf=$(mktemp /tmp/mirror.XXXXXXXX.js)
            if ! curl -fsSL -m 90 --retry 3 -A "Loon/3.5.1" "$url" -o "$tmpf"; then
              echo "❌ $name (FETCH FAILED)"
              mark_fail "$dest"
              keep_old "$dest"
              rm -f "$tmpf"; return
            fi
            # ── 门禁 1: 体积下限 (绝对 200B + 相对上次抓取 50%) ──
            # 2026-09-11 审计 (CI-01): 原为统一 200B 绝对下限。对 .js/.plugin 尚可, 但对规则
            # 列表形同虚设 — 仓库内 .list 实测 588B (loon-Epic) 至 3.9MB (goodbyeads-qx),
            # 跨度 4 个数量级, 200B 阈值下"上游返回一小段非 HTML 的占位正文"可静默通过并
            # 进入分发链 (CDN 随后分发给所有客户端)。
            # 单纯抬高绝对阈值不可行: 任何统一值要么放过小列表, 要么误杀 Epic/Privacy 这类
            # 天然很小的列表。故改为**相对下限** — 新抓取体积须 ≥ 上次成功抓取原始体积的 50%,
            # 阈值自校准到每个文件自身的量级, 对"上游被换成小体积占位内容"与"传输被截断"都成立。
            # 绝对下限始终保留 (相对下限只会上调它, 不会下调), 覆盖"新增镜像/无旧记录"的情形。
            local size; size=$(wc -c < "$tmpf")
            local min_bytes=200
            local prev_bytes
            prev_bytes=$(awk -F'\t' -v k="$dest" '$1 == k { print $2; exit }' "$PREV_SIZES")
            if [ -n "$prev_bytes" ] && [ "$prev_bytes" -gt 0 ]; then
              local rel=$(( prev_bytes / 2 ))
              [ "$rel" -gt "$min_bytes" ] && min_bytes=$rel
            fi
            if [ "$size" -lt "$min_bytes" ]; then
              if [ -n "$prev_bytes" ] && [ "$min_bytes" -gt 200 ]; then
                echo "🚫 $name 门禁拦截: 体积相对骤降 (${size}B < 上次 ${prev_bytes}B 的 50%), 保留旧版"
              else
                echo "🚫 $name 门禁拦截: 体积过小 (${size}B < ${min_bytes}B), 保留旧版"
              fi
              GATED=$((GATED + 1)); mark_fail "$dest"
              keep_old "$dest"
              rm -f "$tmpf"; return
            fi
            # ── 门禁 2: 非 HTML ──
            # 注: 用 -E 而非 BRE 的 '\|' — GNU grep 认 '\|' 为交替, BSD/macOS grep 视作
            # 字面量 (整个模式永不匹配)。CI 跑在 ubuntu, 但门禁必须本地可复现才能被验证。
            if head -c 200 "$tmpf" | grep -qiE '<!doctype|<html'; then
              echo "🚫 $name 门禁拦截: 内容为 HTML 错误页, 保留旧版"
              GATED=$((GATED + 1)); mark_fail "$dest"
              keep_old "$dest"
              rm -f "$tmpf"; return
            fi
            # ── 门禁 3: JS 语法 (仅 .js; .list/.conf/.plugin 非 JS) ──
            case "$dest" in
              *.js)
                if ! node --check "$tmpf" 2>/dev/null; then
                  echo "🚫 $name 门禁拦截: node --check 语法错误 (可能半截下载), 保留旧版"
                  GATED=$((GATED + 1)); mark_fail "$dest"
                  keep_old "$dest"
                  rm -f "$tmpf"; return
                fi
                ;;
            esac
            # ── 门禁 4: 插件内 script-path URL 白名单 (防上游投毒) ──
            # 上游被攻破时插件内 script-path 可指向任意恶意域; 白名单外一律拦截保留旧版。
            # 覆盖 .plugin 与 .lpx (同为纯文本 Loon 插件格式, 2026-09-18 WeatherKit 已转 .lpx)。
            case "$dest" in
              *.plugin|*.lpx)
                # 2026-08-29 审计修复 (三处绕过面):
                # 1) tab 写法 `script-path\t=\tURL` — 原 `*= *` 只认空格
                # 2) scheme 大小写 HTTPS://evil.com — 原正则大小写敏感, 整行不进入提取集合
                # 3) 提取为空时显式判定 (纯 rewrite/mock 插件无 script-path), 不再依赖 grep -vq 隐式返回码
                local urls
                 urls=$(grep -oiE 'script-path[[:space:]]*=[[:space:]]*https?://[^ ,")]*' "$tmpf" \
                   | sed 's/script-path[[:space:]]*=[[:space:]]*//I' | tr '[:upper:]' '[:lower:]')
                if [ -n "$urls" ] && printf '%s\n' "$urls" | grep -vqE '^https?://(github\.com|raw\.githubusercontent\.com|gist\.githubusercontent\.com|ws\.wenn\.in|kelee\.one)/'; then
                  echo "🚫 $name 门禁拦截: script-path 指向非白名单域 (疑似投毒), 保留旧版"
                  printf '%s\n' "$urls" | grep -vE '^https?://(github\.com|raw\.githubusercontent\.com|gist\.githubusercontent\.com|ws\.wenn\.in|kelee\.one)/' | head -3
                  GATED=$((GATED + 1)); mark_fail "$dest"
                  keep_old "$dest"
                  rm -f "$tmpf"; return
                fi
                ;;
            esac
            cp "$tmpf" "$path"
            rm -f "$tmpf"
            local sha; sha=$(sha256sum "$path" | awk '{print $1}')
            echo "✅ $name → $path (sha256:${sha:0:12}…, ${size}B)"
            SUCCESS=$((SUCCESS + 1))
            # upstream_bytes = 原始抓取体积 (本地 sed 补丁之前), 供下轮门禁 1 的相对下限使用。
            # 末尾的清单重写只从磁盘重算 sha256/bytes (含补丁后的真实值), 不动本字段 —
            # 故本字段恒为"上游原始体积"语义。
            ENTRIES+=("\"$dest\": {\"source_url\": \"$url\", \"sha256\": \"$sha\", \"bytes\": $size, \"upstream_bytes\": $size, \"fetched_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          }

          # ═══════════════ 脚本 (执行于 MitM 上下文, 最高敏感) ═══════════════
          mirror "https://gist.githubusercontent.com/ddgksf2013/4f53b7c6083678df25fecc8ff68b52c4/raw/netease.adblock.js" \
            "netease.adblock.js" "ddgksf2013 gist / netease.adblock.js"
          mirror "https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/amdc.js" \
            "amdc.js" "ddgksf2013/Scripts / amdc.js"
          mirror "https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/applet.js" \
            "applet.js" "ddgksf2013/Scripts / applet.js"
          mirror "https://raw.githubusercontent.com/app2smile/rules/master/js/bilibili-json.js" \
            "bilibili-json.js" "app2smile / bilibili-json.js"
          mirror "https://raw.githubusercontent.com/app2smile/rules/master/js/bilibili-proto.js" \
            "bilibili-proto.js" "app2smile / bilibili-proto.js"
          mirror "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js" \
            "youtube.request.js" "Maasea / youtube.request.js"
          mirror "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js" \
            "youtube.response.js" "Maasea / youtube.response.js"

          # AllInOne 的传递性脚本依赖: 消除 gist/raw 单点，
          # 插件内 script-path 由下方补丁重写指向自建 CDN。
          mirror "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/script/startup/startup.js" \
            "scripts/startup.js" "blackmatrix7 / startup.js"
          mirror "https://gist.githubusercontent.com/blackmatrix7/f5f780d0f56b319b6ad9848fd080bb18/raw/zheye.min.js" \
            "scripts/zheye.min.js" "blackmatrix7 gist / zheye.min.js"

          # ═══════════════ 解析器脚本 ═══════════════
          # Sub-Store 解析器 (sub-store-parser.loon.min.js, 1.27MB) 已于 2026-09-11 移除:
          #   该 bundle 在订阅解析上下文执行 (可见全部节点凭据), 且上游为 releases/latest 浮动发布。
          #   哈希门禁仅能证明"与上游发布一致", 不能证明上游可信 — 与 Sub-Store 插件同一信任前提。
          #   连带移除: template/loon.tpl 的 [General] resource-parser 与 [Plugin] sub-store 条目。
          #   如需恢复: 锁定具体版本号 (非 latest) 并在此处重新 mirror。

          # ═══════════════ 规则列表 (blackmatrix7, Loon 格式) ═══════════════
          for n in Advertising Privacy Hijacking Epic China Global; do
            mirror "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/$n/$n.list" \
              "rules/loon-$n.list" "blackmatrix7 Loon / $n.list"
          done
          mirror "https://raw.githubusercontent.com/8680/GOODBYEADS/master/data/rules/qx.list" \
            "rules/goodbyeads-qx.list" "GOODBYEADS / qx.list"

          # ═══════════════ ddgksf2013 开屏广告数据源 (2026-08-31 数据化) ═══════════════
          # 上游源头 ddgksf2013.top/rewrite/StartUpAds.conf 已转向 HTML 索引页,
          # 采用 ifflagged/Romeo 的每日镜像; QX reject 规则由生成器转为 Loon [Rewrite]
          # 段注入 Plugin/startup-adblock-pro.plugin (Loon 插件不支持远程 list, 见工具注释)
          mirror "https://raw.githubusercontent.com/ifflagged/Romeo/main/Modules/Others/ddgksf2013/Official/StartUpAds.conf" \
            "rules/ddgksf-StartUpAds.conf" "ddgksf2013 StartUpAds.conf (ifflagged 镜像)"
          node tools/build-startup-plugin.mjs

          # ── 开屏数据源新鲜度提示 (2026-09-22, 只报告不判红) ──
          # StartUpAds.conf @UpdateTime 若停滞超 21 天即 warn: 新 App 版本开屏接口
          # 无覆盖, 提示考虑备选源/自产规则。21 天口径 = 约 3 个 App 发版周期;
          # 不阻断 (keep_old 哲学: 旧规则对旧版 App 依然有效)。
          UPD=$(grep -m1 -o "@UpdateTime[[:space:]]*[0-9-]*" Mirror/rules/ddgksf-StartUpAds.conf | grep -o "[0-9-]*$" || true)
          if [ -n "$UPD" ]; then
            AGE_DAYS=$(node -e "console.log(Math.floor((Date.now() - Date.parse('$UPD')) / 864e5))")
            if [ "$AGE_DAYS" -gt 21 ]; then
              echo "::warning::StartUpAds 上游 @UpdateTime=$UPD ($AGE_DAYS 天前) — 开屏情报停滞, 新 App 版本可能无覆盖"
            else
              echo "StartUpAds 上游新鲜 (@UpdateTime=$UPD, $AGE_DAYS 天前)"
            fi
          fi

          # ── 规则顺序遮蔽检查 (2026-09-11 深度审计 NEW-05 重写) ──
          # 旧实现是硬编码 20 个关键词的 grep, 且**方向反了**: 它只查 "Global 里有没有
          # 广告域", 而真正的缺陷是反向的 —— Global 是 Proxy 列表且排在三个 REJECT 列表
          # **之前**, 其 36 个 DOMAIN-KEYWORD 是宽匹配, 会抢先命中后续 REJECT 条目
          # (实测唯一实例: Global 的 google 抢先命中 Advertising 的 googleads)。
          # 现改为与 Advertising/Privacy/Hijacking 做**实际集合交集断言** (KEYWORD 子串级),
          # 要求每个被遮蔽条目都有本地 [Rule] REJECT 兜底; 并告警上游文件头与正文计数
          # 不符 (该头描述的并非 Loon 正文, 曾导致模板写下错误的 "34,579 SUFFIX")。
          # 同一脚本也在 config-validate.yml 中执行 (PR 阶段即可发现)。
          if ! node tools/rule-shadow-check.mjs; then
            echo "❌ 规则顺序遮蔽检查失败 — 见上方明细"
            FAIL=$((FAIL+1))
          fi

          # Rewrite 规则冗余检查 (2026-09-20 精简优化新增): 镜像更新可能在上游侧引入新的
          # 同文件前缀遮蔽/改变镜像文件内容, 与 config-validate.yml 同门禁, 失败 keep_old。
          if ! node tools/rewrite-redundancy-check.mjs; then
            echo "❌ Rewrite 规则冗余检查失败 — 见上方明细 (新引入的未登记冗余)"
            FAIL=$((FAIL+1))
          fi

          # ═══════════════ Loon rewrite 插件 ═══════════════
          # 注: 插件内 script-path 传递性依赖已收敛 (2026-08), 见下方补丁;
          # 镜像消除插件文件本身 + 22 条脚本引用的全部单点
          mirror "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/Loon/AllInOne/AllInOne.plugin" \
            "rules/loon-AllInOne.plugin" "blackmatrix7 Loon / AllInOne.plugin"
          mirror "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/Loon/AdvertisingScript/AdvertisingScript.plugin" \
            "rules/loon-AdvertisingScript.plugin" "blackmatrix7 Loon / AdvertisingScript.plugin"

          # ── 本地补丁 (2026-08 审计): 上游拼写错误 m.meitun.com → m.meituan.com ──
          # 覆盖 rewrite 行 (转义形式 m\.meitun\.com) 与 MITM hostname 行 (裸形式);
          # 每日镜像后强制修正, 若上游已修复则为 no-op (自愈)
          sed -i 's/m\\.meitun\\.com/m\\.meituan\\.com/g; s/m\.meitun\.com/m\.meituan\.com/g' \
            Mirror/rules/loon-AllInOne.plugin

          # ── 本地补丁 (2026-08 审计): script-path 传递依赖收敛到自建 CDN ──
          # AllInOne (22 条) / AdvertisingScript (26 条) 内部 script-path 原直连
