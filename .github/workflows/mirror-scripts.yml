            Mirror/rules/loon-Advertising.list
          sed -i '/# === BEGIN 3kaiu 666OS交叉补齐/,/# === END 3kaiu 666OS交叉补齐/d' \
            Mirror/rules/loon-Advertising.list
          cat >> Mirror/rules/loon-Advertising.list <<'EOF'
