          # ── 本地补丁 (2026-09-11 审计, SEC-02): DualSubs 浮动 latest → 锁定具体版本 ──
          # 上游 DualSubs.YouTube / DualSubs.Netflix 两个插件内嵌的 script-path 指向
          # Universal 仓库的 releases/latest (共 5 处), 属**浮动引用**: 无法锁定版本、
          # 无法验证内容, 上游任一时刻替换产物即静默进入分发链。
          # 每日镜像后强制重写 → 上游若改回 latest 会被再次修正 (自愈)。
          # 注: 三个插件均由 loon.tpl 的 DualSubs 段接线。
          # DS_VER 动态解析 (2026-09-18 解钉配套): 钉死 v1.7.5 会在 Universal 发新版时
          # 与 YouTube/Netflix 内嵌指向产生版本偏斜, 故每轮从 release API 取 Universal
          # 最新 tag; API 失败/限流 (无合法 tag) 则回退上一已知版本并告警
          # (不阻断, 偏斜风险转人工)。
          DS_VER="$(curl -fsSL -m 30 https://api.github.com/repos/DualSubs/Universal/releases/latest | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const t=JSON.parse(s).tag_name;if(/^v[\w.]+$/.test(t||""))console.log(t)}catch(e){}})')"
          if [ -z "$DS_VER" ]; then
            DS_VER="v1.7.5"
            echo "::warning::DualSubs Universal 最新 tag 解析失败, 回退 DS_VER=v1.7.5 (若上游已发新版, YouTube/Netflix 内嵌引用存在版本偏斜, 请人工核对)"
          else
            echo "DualSubs Universal 最新 tag: $DS_VER"
          fi
          sed -i "s|https://github.com/DualSubs/Universal/releases/latest/download/|https://github.com/DualSubs/Universal/releases/download/${DS_VER}/|g" \
            Mirror/dualsubs/DualSubs.YouTube.plugin Mirror/dualsubs/DualSubs.Netflix.plugin
          # 断言: 补丁后不应再有任何浮动引用。上游若新增产物或改回 latest, 在此暴露。
          if grep -n -e "DualSubs/Universal/releases/latest" Mirror/dualsubs/*.plugin; then
            echo "🚫 DualSubs 补丁后仍存在 releases/latest 浮动引用 (上游可能新增了产物), 请人工核对并锁定版本"
            mark_fail "dualsubs:releases/latest 浮动引用未锁定"
          fi

