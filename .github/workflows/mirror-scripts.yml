name: Mirror External Scripts

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [mirror]

# 2026-08-29 审计: workflow_dispatch 手动连点或与 schedule 撞车时,
# 两个 run 会对同一天分支互相 force-push / 重复开 PR。串行化 (不取消在跑的: 镜像需要完整跑完)。
concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 安全改造 (2026-07 审计):
      # 1. 写入前门禁: *.js 过 node --check 语法 / 体积≥200B / 非 HTML 错误页 — 任一不过保留旧文件
      # 2. MANIFEST.json: 每个镜像文件记录 source_url + sha256 + 抓取时间, 变更在 PR diff 中高亮
      # 3. PR 制: 不再直推 main — 推送到 mirror/<date> 分支并开/更新 PR, 人工审 diff 后合并
      # 4. 覆盖范围: 脚本 + 规则列表 + rewrite 模块 + NSRingo 插件 (跟随 latest),
      #    Profile 全部远程引用收敛到自建 CDN (ws.wenn.in/main/Mirror/...)
      - name: Mirror upstream resources (with gates)
        run: |
          SUCCESS=0
          FAIL=0
          GATED=0
          OLD_MANIFEST="Mirror/MANIFEST.json"

          # 读取旧清单中某文件的记录 (用于抓取失败时保留旧 sha)
          old_entry() {
            [ -f "$OLD_MANIFEST" ] && node -e '
              const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const e = m.files && m.files[process.argv[2]];
              if (e) console.log(JSON.stringify(e));
            ' "$OLD_MANIFEST" "$1" 2>/dev/null || true
          }

          declare -a ENTRIES
          # 抓取/门禁失败时保留旧清单条目 (镜像文件回退旧版, 清单不丢记录)
          keep_old() { local oe; oe=$(old_entry "$1"); [ -n "$oe" ] && ENTRIES+=("\"$1\": $oe"); }


          mirror() {
            local url="$1"
            local dest="$2"
            local name="$3"
            local path="Mirror/$dest"
            mkdir -p "$(dirname "$path")"
            local tmpf; tmpf=$(mktemp /tmp/mirror.XXXXXXXX.js)
            if ! curl -fsSL -m 90 --retry 3 -A "Loon/3.3.9" "$url" -o "$tmpf"; then
              echo "❌ $name (FETCH FAILED)"
              FAIL=$((FAIL + 1))
              keep_old "$dest"
              rm -f "$tmpf"; return
            fi
            # ── 门禁 1: 体积下限 (防 200 状态码的 HTML 错误页/半截传输) ──
            local size; size=$(wc -c < "$tmpf")
            if [ "$size" -lt 200 ]; then
              echo "🚫 $name 门禁拦截: 体积过小 (${size}B), 保留旧版"
              GATED=$((GATED + 1)); FAIL=$((FAIL + 1))
              keep_old "$dest"
              rm -f "$tmpf"; return
            fi
            # ── 门禁 2: 非 HTML ──
            if head -c 200 "$tmpf" | grep -qi '<!doctype\|<html'; then
              echo "🚫 $name 门禁拦截: 内容为 HTML 错误页, 保留旧版"
              GATED=$((GATED + 1)); FAIL=$((FAIL + 1))
              keep_old "$dest"
              rm -f "$tmpf"; return
            fi
            # ── 门禁 3: JS 语法 (仅 .js; .list/.conf/.plugin 非 JS) ──
            case "$dest" in
              *.js)
                if ! node --check "$tmpf" 2>/dev/null; then
                  echo "🚫 $name 门禁拦截: node --check 语法错误 (可能半截下载), 保留旧版"
                  GATED=$((GATED + 1)); FAIL=$((FAIL + 1))
                  keep_old "$dest"
                  rm -f "$tmpf"; return
                fi
                ;;
            esac
            # ── 门禁 4: .plugin 内 script-path URL 白名单 (防上游投毒) ──
            # 上游被攻破时插件内 script-path 可指向任意恶意域; 白名单外一律拦截保留旧版
            case "$dest" in
              *.plugin)
                # 2026-08-29 审计修复 (三处绕过面):
                # 1) tab 写法 `script-path\t=\tURL` — 原 `*= *` 只认空格
                # 2) scheme 大小写 HTTPS://evil.com — 原正则大小写敏感, 整行不进入提取集合
                # 3) 提取为空时显式判定 (纯 rewrite/mock 插件无 script-path), 不再依赖 grep -vq 隐式返回码
                local urls
                urls=$(grep -oiE 'script-path[[:space:]]*=[[:space:]]*https?://[^ ,")]*' "$tmpf" \
                  | sed 's/script-path[[:space:]]*=[[:space:]]*//' | tr '[:upper:]' '[:lower:]')
                if [ -n "$urls" ] && printf '%s\n' "$urls" | grep -vqE '^https?://(github\.com|raw\.githubusercontent\.com|gist\.githubusercontent\.com|ws\.wenn\.in|3kaiu\.github\.io|kelee\.one)/'; then
                  echo "🚫 $name 门禁拦截: script-path 指向非白名单域 (疑似投毒), 保留旧版"
                  printf '%s\n' "$urls" | grep -vE '^https?://(github\.com|raw\.githubusercontent\.com|gist\.githubusercontent\.com|ws\.wenn\.in|3kaiu\.github\.io|kelee\.one)/' | head -3
                  GATED=$((GATED + 1)); FAIL=$((FAIL + 1))
                  keep_old "$dest"
                  rm -f "$tmpf"; return
                fi
                ;;
            esac
            cp "$tmpf" "$path"
            rm -f "$tmpf"
            local sha; sha=$(sha256sum "$path" | awk '{print $1}')
            echo "✅ $name → $path (sha256:${sha:0:12}…, ${size}B)"
            SUCCESS=$((SUCCESS + 1))
            ENTRIES+=("\"$dest\": {\"source_url\": \"$url\", \"sha256\": \"$sha\", \"bytes\": $size, \"fetched_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          }

          # ═══════════════ 脚本 (执行于 MitM 上下文, 最高敏感) ═══════════════
          mirror "https://gist.githubusercontent.com/ddgksf2013/4f53b7c6083678df25fecc8ff68b52c4/raw/netease.adblock.js" \
            "netease.adblock.js" "ddgksf2013 gist / netease.adblock.js"
          mirror "https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/amdc.js" \
            "amdc.js" "ddgksf2013/Scripts / amdc.js"
          mirror "https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/applet.js" \
            "applet.js" "ddgksf2013/Scripts / applet.js"
          mirror "https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/weibo_json.js" \
            "weibo_json.js" "ddgksf2013/Scripts / weibo_json.js"
          mirror "https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/ximalaya_json.js" \
            "ximalaya_json.js" "ddgksf2013/Scripts / ximalaya_json.js"
          mirror "https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/keepStyle.js" \
            "keepStyle.js" "ddgksf2013/Scripts / keepStyle.js"
          mirror "https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/smzdm_json.js" \
            "smzdm_json.js" "ddgksf2013/Scripts / smzdm_json.js"
          mirror "https://raw.githubusercontent.com/app2smile/rules/master/js/bilibili-json.js" \
            "bilibili-json.js" "app2smile / bilibili-json.js"
          mirror "https://raw.githubusercontent.com/app2smile/rules/master/js/bilibili-proto.js" \
            "bilibili-proto.js" "app2smile / bilibili-proto.js"
          mirror "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js" \
            "youtube.request.js" "Maasea / youtube.request.js"
          mirror "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js" \
            "youtube.response.js" "Maasea / youtube.response.js"

          # AllInOne 的传递性脚本依赖 (2026-08 审计): 消除 gist/raw 单点,
          # 插件内 22 条 script-path 由下方补丁重写指向自建 CDN
          mirror "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/script/startup/startup.js" \
            "scripts/startup.js" "blackmatrix7 / startup.js"
          mirror "https://gist.githubusercontent.com/blackmatrix7/f5f780d0f56b319b6ad9848fd080bb18/raw/zheye.min.js" \
            "scripts/zheye.min.js" "blackmatrix7 gist / zheye.min.js"

          # ═══════════════ 解析器脚本 (订阅解析时执行, 可见全部节点凭据) ═══════════════
          mirror "https://github.com/sub-store-org/Sub-Store/releases/latest/download/sub-store-parser.loon.min.js" \
            "rules/loon-sub-store-parser.js" "Sub-Store / sub-store-parser.loon.min.js"

          # ═══════════════ 规则列表 (blackmatrix7, Loon 格式) ═══════════════
          for n in Advertising Privacy Hijacking Epic China Global; do
            mirror "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/$n/$n.list" \
              "rules/loon-$n.list" "blackmatrix7 Loon / $n.list"
          done
          mirror "https://raw.githubusercontent.com/8680/GOODBYEADS/master/data/rules/qx.list" \
            "rules/goodbyeads-qx.list" "GOODBYEADS / qx.list"

          # ═══════════════ ddgksf2013 开屏广告数据源 (2026-08-31 数据化) ═══════════════
          # 上游源头 ddgksf2013.top/rewrite/StartUpAds.conf 已转向 HTML 索引页,
          # 采用 ifflagged/Romeo 的每日镜像; QX reject 规则由生成器转为 Loon [Rewrite]
          # 段注入 Plugin/startup-adblock-pro.plugin (Loon 插件不支持远程 list, 见工具注释)
          mirror "https://raw.githubusercontent.com/ifflagged/Romeo/main/Modules/Others/ddgksf2013/Official/StartUpAds.conf" \
            "rules/ddgksf-StartUpAds.conf" "ddgksf2013 StartUpAds.conf (ifflagged 镜像)"
          node tools/build-startup-plugin.mjs

          # ── Global 列表纯净度检查 (2026-08 审计) ──
          # 远端顺序已调整为 China → Global → Advertising → ... (国际流量提前终止),
          # 前提是 Global 列表不含广告/隐私/国内域 — 上游更新若引入污染立即拦截 (fail)
          GLOBAL_BAD='(doubleclick|googleadservices|googletagmanager|googlesyndication|google-analytics|app-measurement|crashlytics|appsflyer|mixpanel|segment\.io|amplitude|branch\.io|adjust\.com|kochava|sentry\.io|qq\.com|taobao|tmall|baidu\.com|163\.com|aliyun|jd\.com|bilibili|meituan|douyin)'
          if grep -E "^(DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN),.*${GLOBAL_BAD}" Mirror/rules/loon-Global.list; then
            echo "❌ Global 列表检测到广告/隐私/国内域污染 (见上) — 已拦截, 需复检远端顺序前提"
            FAIL=$((FAIL+1))
          else
            echo "✅ Global 列表纯净度检查通过: 无广告/隐私/国内域"
          fi

          # ═══════════════ Loon rewrite 插件 ═══════════════
          # 注: 插件内 script-path 传递性依赖已收敛 (2026-08), 见下方补丁;
          # 镜像消除插件文件本身 + 22 条脚本引用的全部单点
          mirror "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/Loon/AllInOne/AllInOne.plugin" \
            "rules/loon-AllInOne.plugin" "blackmatrix7 Loon / AllInOne.plugin"
          mirror "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/Loon/AdvertisingScript/AdvertisingScript.plugin" \
            "rules/loon-AdvertisingScript.plugin" "blackmatrix7 Loon / AdvertisingScript.plugin"

          # ── 本地补丁 (2026-08 审计): 上游拼写错误 m.meitun.com → m.meituan.com ──
          # 覆盖 rewrite 行 (转义形式 m\.meitun\.com) 与 MITM hostname 行 (裸形式);
          # 每日镜像后强制修正, 若上游已修复则为 no-op (自愈)
          sed -i 's/m\\.meitun\\.com/m\\.meituan\\.com/g; s/m\.meitun\.com/m\.meituan\.com/g' \
            Mirror/rules/loon-AllInOne.plugin

          # ── 本地补丁 (2026-08 审计): script-path 传递依赖收敛到自建 CDN ──
          # AllInOne (22 条) / AdvertisingScript (26 条) 内部 script-path 原直连
          # blackmatrix7 的 raw/gist (上游可删改, 单点); 改为镜像路径, 上游更新后强制重写 (自愈)
          sed -i 's|https://gist.githubusercontent.com/blackmatrix7/f5f780d0f56b319b6ad9848fd080bb18/raw/zheye.min.js|https://ws.wenn.in/main/Mirror/scripts/zheye.min.js|g; s|https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/script/startup/startup.js|https://ws.wenn.in/main/Mirror/scripts/startup.js|g' \
            Mirror/rules/loon-AllInOne.plugin Mirror/rules/loon-AdvertisingScript.plugin

          # ── 本地补丁 (2026-08-12): 国内广告 SDK 域名追加 ──
          # 上游 blackmatrix7 Loon 版 Advertising 列表仅 278 KEYWORD + 486 IP-CIDR + 14 URL-REGEX,
          # 不含国内广告 SDK (beizi/jpush统计/mmstat/ugdtimg/1rtb/66mobi/cloooud/hubcloud 等);
          # Loon 主配置 [Rule] (template/loon.tpl) 已硬拦截 (GEOIP 之前, 本地规则优先),
          # 此处同步追加列表兜底。
          # 幂等: 先删除旧追加块再追加; 推送保活: 仅统计子域, 保留 config.jpush.cn/user.jpush.cn (极光推送) 与 api.getui.com (个推推送)
