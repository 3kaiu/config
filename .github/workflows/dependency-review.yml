# PR 依赖审查: 引入已知漏洞依赖或 license 变更时自动拦截
# 与 Dependabot security updates 配套 — 前者防新漏洞进 main, 后者修存量
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-3.0, AGPL-3.0-or-later
