# CDN 内容哈希校验 (长期演进 #13)
#
# 每日核对 ws.wenn.in 分发内容与仓库实际文件的 sha256:
#   - 哈希不一致 = CDN 被篡改/缓存污染/回退未同步 → 开 Issue (+Bark 告警)
#   - 拉取失败 ≥3 个 = CDN 可用性异常 → 开 Issue
# 上游 200 状态码健康检查 (upstream-health.yml) 的补强: 那个只查可达, 这个查内容。

name: CDN Content Verify

on:
  schedule:
    - cron: '34 2 * * *'   # 02:34, 错开 mirror(03:00)/health(02:17)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    # BARK_PUSH 须定义在 job 级: step 级 if 读不到本 step 自己的 env 块
    env:
      BARK_PUSH: ${{ secrets.BARK_PUSH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare CDN content hashes
        id: check
        run: |
          echo "## CDN Content Verify" >> $GITHUB_STEP_SUMMARY
          MISMATCH=""
          FETCHFAIL=""
          OK=0

          # Mirror/ 文件列表来自 MANIFEST.json（权威清单，新增镜像自动纳入校验）
          MIRROR_FILES=$(node -e '
            const m = JSON.parse(require("fs").readFileSync("Mirror/MANIFEST.json","utf8"));
            Object.keys(m.files).forEach(f => console.log("Mirror/" + f));
          ')
          # 非 Mirror 文件仍用 git ls-files
          LOCAL_FILES=$(git ls-files 'Scripts/*.js' 'Plugin/*.plugin' 'Kelee/*.plugin' \
                        'Profile/Loon.lcf')

          FILES=$(echo "$MIRROR_FILES"$'\n'"$LOCAL_FILES" | sort -u)

          for f in $FILES; do
            url="https://ws.wenn.in/main/$f"
            tmp=$(mktemp)
            if ! curl -fsSL -m 30 --retry 2 -o "$tmp" "$url"; then
              FETCHFAIL="$FETCHFAIL$f\n"
              echo "⚠️ fetch failed: $f"
              rm -f "$tmp"
              continue
            fi
            remote=$(sha256sum "$tmp" | awk '{print $1}')
            local=$(sha256sum "$f" | awk '{print $1}')
            rm -f "$tmp"
            if [ "$remote" != "$local" ]; then
              MISMATCH="$MISMATCH$f\n"
              echo "❌ hash mismatch: $f"
            else
              OK=$((OK+1))
            fi
          done
          MISMATCH_COUNT=$(printf "$MISMATCH" | grep -c . || true)
          FETCHFAIL_COUNT=$(printf "$FETCHFAIL" | grep -c . || true)
          echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ 哈希一致 | $OK |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ 哈希不一致 | $MISMATCH_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ 拉取失败 | $FETCHFAIL_COUNT |" >> $GITHUB_STEP_SUMMARY
          {
            echo "mismatch_count=$MISMATCH_COUNT"
            echo "fetchfail_count=$FETCHFAIL_COUNT"
            echo "mismatch_files<<EOF"
            printf "$MISMATCH"
            echo "EOF"
            echo "fetchfail_files<<EOF"
            printf "$FETCHFAIL"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          # 不一致即失败 (拉取失败容忍 <3 个的瞬时抖动)
          if [ "$MISMATCH_COUNT" -gt 0 ] || [ "$FETCHFAIL_COUNT" -ge 3 ]; then
            echo "alert_needed=true" >> $GITHUB_OUTPUT
            exit 1
          fi

      # GitHub Pages 兜底链路 (3kaiu.github.io/config) 可达性 — 非阻断
      # 仅汇总到 step summary: Pages 是 ws.wenn.in 故障时的备用分发, 主链路告警不混淆
      - name: GitHub Pages fallback parity (non-blocking)
        run: |
          PAGES_BASE="https://3kaiu.github.io/config"
          if ! curl -fsSL -m 30 -o /dev/null "$PAGES_BASE/Mirror/MANIFEST.json" 2>/dev/null; then
            echo "⚠️ GitHub Pages 未启用或未部署, 跳过 parity 检查 (启用方法见 pages-deploy.yml 头注)"
            echo "### GitHub Pages Fallback Parity" >> $GITHUB_STEP_SUMMARY
            echo "**未启用/未部署 — 跳过**" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          OK=0; FAIL=0
          while read -r f; do
            if curl -fsSL -m 30 -o /dev/null "$PAGES_BASE/$f" 2>/dev/null; then
              OK=$((OK+1))
            else
              FAIL=$((FAIL+1)); echo "⚠️ pages fetch failed: $f"
            fi
          done <<< "$(git ls-files 'Mirror' 'Scripts/*.js' 'Plugin/*.plugin' 'Kelee/*.plugin' 'Profile/Loon.lcf')"
          echo "### GitHub Pages Fallback Parity" >> $GITHUB_STEP_SUMMARY
          echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ 可达 | $OK |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ 拉取失败 | $FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "pages_ok=$OK pages_fail=$FAIL" >> $GITHUB_OUTPUT

      # Bark 告警 (可选: 仓库 Secrets 配置 BARK_PUSH 后启用)
      - name: Bark alert
        if: failure() && env.BARK_PUSH != ''
        run: |
          curl -fsSL -m 15 -o /dev/null \
            "$BARK_PUSH/CDN校验失败/mismatch=${{ steps.check.outputs.mismatch_count }}%20fetchfail=${{ steps.check.outputs.fetchfail_count }}?group=config&icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Back.png" \
            || echo "Bark 推送失败(不阻断)"

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = '[cdn-verify] ws.wenn.in 内容与仓库不一致';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'cdn-verify'
            });
            if (issues.length > 0) {
              core.info('已存在 open issue, 跳过创建');
              return;
            }
            const mismatch = `${{ steps.check.outputs.mismatch_files }}`.split('\n').filter(Boolean);
            const fetchfail = `${{ steps.check.outputs.fetchfail_files }}`.split('\n').filter(Boolean);
            const body = [
              '## CDN 内容哈希校验失败',
              '',
              mismatch.length ? '### ❌ 哈希不一致 (可能被篡改/缓存污染)\n```\n' + mismatch.join('\n') + '\n```' : '',
              fetchfail.length ? '### ⚠️ 拉取失败\n```\n' + fetchfail.join('\n') + '\n```' : '',
              '',
              '处理: 检查 CDN 回源源是否指向本仓库 main 分支最新内容; 哈希不一致时立即排查 CDN 配置与域名安全 (见 doc/infrastructure.md)。'
            ].filter(Boolean).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['cdn-verify']
            });
