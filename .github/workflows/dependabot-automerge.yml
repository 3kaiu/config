name: Dependabot Automerge

# Dependabot 依赖升级 PR 的自动合并。
# 注意: main 无分支保护 (proxy-sync 需直推), 因此不能用 `gh pr merge --auto` —
# 无 required checks 时 auto-merge 会立即合并并绕过全部 CI。
# 此 workflow 自行轮询 head SHA 上的 check-runs, 全部通过后才 squash 合并。

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 不 checkout PR 代码 — 只调用 API, 不执行任何来自 PR 的内容
      - name: Wait for CI then merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -x
          echo "PR #$NUMBER ($HEAD_SHA): 等待 CI..."
          for i in $(seq 1 90); do
            # 每个外部调用包 timeout, 防 gh 偶发挂起拖满整个 job
            summary=$(timeout 60 gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?per_page=100")
            api_rc=$?
            if [ "$api_rc" -ne 0 ] || [ -z "$summary" ]; then
              echo "[$i] ⚠️ check-runs API 调用失败 (rc=$api_rc), 重试"
              sleep 30; continue
            fi
            # 排除自身 (本 job 的 check 挂在同一 head SHA 上, 运行期间永远 IN_PROGRESS,
            # 不排除会自我等待直到超时 — 2026-08-25 PR#32 实测死锁)
            total=$(echo "$summary" | jq '[.check_runs[] | select(.name != "automerge")] | length')
            pending=$(echo "$summary" | jq '[.check_runs[] | select(.name != "automerge") | select(.status != "COMPLETED")] | length')
            failed=$(echo "$summary" | jq '[.check_runs[] | select(.name != "automerge") | select(.status == "COMPLETED") | select(.conclusion != "SUCCESS" and .conclusion != "NEUTRAL" and .conclusion != "SKIPPED")] | length')
            echo "[$i] checks=$total pending=$pending failed=$failed"
            if [ "$failed" -gt 0 ]; then
              echo "❌ 存在失败的 check, 放弃自动合并"
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "✅ 全部 check 通过, squash 合并"
              TITLE=$(gh pr view "$NUMBER" --json title -q .title)
              # 显式 subject/body: 杜绝非 TTY 下 gh 的任何交互可能
              timeout 120 gh pr merge "$NUMBER" --squash \
                --subject "${TITLE} (#$NUMBER)" \
                --body ""
              merge_rc=$?
              echo "gh pr merge rc=$merge_rc"
              exit "$merge_rc"
            fi
            sleep 30
          done
          echo "⏱️ 45 分钟内 CI 未完成, 放弃自动合并"
          exit 1
