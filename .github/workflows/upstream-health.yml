name: Upstream Health Check

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-upstreams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check all upstream URLs
        id: check
        run: |
          ALL_OK=true
          # 2026-09-11 审计 (CI-03): 原实现把 $name/$status/$url 直接插值进 node 源码
          # (`r.push({name: '$name', …})`)。值中出现单引号 / 反斜杠即破坏该 node 脚本 —
          # 上游 URL 或探活名称一旦含引号, JSON 累积链就此断裂 (静默的部分失败: 之后
          # 每条探活都报错, 而 --fail 未开, 只是结果缺失)。这既是注入面也是可靠性缺陷。
          # 另: 原实现每个 URL 起一个 node 进程 (~50 次/轮) 只为 append 一个数组元素。
          # 现改为: TSV 累积 → 循环结束后单次转换; 数据经 stdin 传递, 不经源码插值。
          RESULTS_TSV=""
          RESULTS_DIR=$(mktemp -d)

          check_url() {
            local name="$1" url="$2"
            # 制表符守卫前置 (同步 fail-fast): status 只可能来自 %{http_code}
            # 或固定串, 永不含制表符, 故此处只判 name/url 即可, 与原语义等价。
            case "${name}${url}" in
              *$'\t'*) echo "::error::探活字段含制表符, 无法序列化: $name"; exit 1 ;;
            esac
            # 并行探活: URL 串行 × 30s 超时逼近
            # 15min 上限。后台并发, 结果落盘再汇总; 日志按序回放避免交错。
            (
              local status
              # ── 2026-09-29 全方位审计 P2-6: mmdb 从"只探状态码"升级为内容完整性校验 ──
              # 这两条是 Loon [General] 的 `geoip-url` / `ipasn-url`, 客户端直接下载并用于
              # 路由决策 —— 上游返回 HTML 错误页 / 被截断 / 换成非 mmdb, HTTP 仍是 200,
              # 纯状态码探活看不出来, 但 DNS 分流会立刻出错。
              # 校验两项: 体积 ≥5MB + 尾部 4KB 含 MaxMind metadata marker (`ab cd ef MaxMind.com`,
              # 实测 Country.mmdb 距末尾 246B、GeoLite2-ASN.mmdb 距末尾 200B)。
              # 失败时把 status 改写成非 "200" 的显式串 → 下游三处判定 (ALL_OK / summary /
              # issue) 不用改一行即自动判红; 成功保持 "200", 对其余探活零影响。
              # 不镜像入库的理由: 两文件 7.7MB + 12.1MB 且**每日变化**, 入库会让 git pack
              # (当前 10.77 MiB) 每天多一份完整 blob, 一个月约 600MB —— 见 AGENTS.md 决策留痕。
              local body="/dev/null" tmp="" mt=30
              case "$url" in
                *.mmdb) tmp=$(mktemp); body="$tmp"; mt=60 ;;
                # ── 2026-09-30 (吸纳 SukkaW/Surge 的 post-deploy marker 判据): 自建 CDN 资源
                # 从"只探状态码"升级为**内容哈希一致**。机制已取证: ws.wenn.in/main/<path>
                # 是 origin/main 的**纯字节镜像** (实测 qidian.plugin 两边 sha256 都是
                # 3b81e1de…, Scripts/Qidian.js 逐字节一致) ⇒ 同路径比对 sha256 是精确不变量。
                # 补的三类静默失效: ① CDN 缓存滞后, 推送后客户端仍拉旧规则(状态 200, 内容旧);
                # ② 200 但正文是 HTML 错误页/被截断; ③ 构建产物改了没重新发布。
                https://ws.wenn.in/*) tmp=$(mktemp); body="$tmp" ;;
              esac
              # 不用 -f: 失败状态码 (403/404) 也要拿到真实数字; 网络层异常时才记 000。
              # --retry 2 (2026-09-18 优化审计): 调度任务单次抖动即开 issue, 与镜像重试实践对齐。
              status=$(curl -sSL -m "$mt" --retry 2 -o "$body" -w "%{http_code}" "$url" || true)
              [ -z "$status" ] && status="000"
              if [ -n "$tmp" ]; then
                if [ "$status" = "200" ]; then
                  local size marker
                  size=$(wc -c < "$tmp" | tr -d '[:space:]')
                  case "$url" in
                    *.mmdb)
                      marker=$(tail -c 4096 "$tmp" | grep -ac "MaxMind.com" || true)
                      if [ "${size:-0}" -lt 5000000 ]; then
                        status="200 (mmdb 体积异常 ${size}B < 5MB)"
                      elif [ "${marker:-0}" = "0" ]; then
                        status="200 (mmdb 缺 MaxMind metadata marker, 可能是错误页/截断)"
                      fi
                      ;;
                    https://ws.wenn.in/*)
                      # 同路径比对: URL 去掉 CDN 前缀即仓库内相对路径。
                      local rel cdnh repo_h
                      rel="${url#https://ws.wenn.in/main/}"
                      if [ ! -f "$rel" ]; then
                        status="200 (CDN 有内容但仓库无此文件: $rel —— 模板引用与仓库脱节)"
                      else
                        cdnh=$(sha256sum "$tmp" | cut -d' ' -f1)
                        repo_h=$(sha256sum "$rel" | cut -d' ' -f1)
                        if [ "$cdnh" != "$repo_h" ]; then
                          # 单次不一致可能是边缘节点回源竞态 ⇒ 复取一次再判, 避免抖动开 issue。
                          sleep 3
                          curl -sSL -m "$mt" --retry 2 -o "$tmp" "$url" || true
                          cdnh=$(sha256sum "$tmp" | cut -d' ' -f1)
                        fi
                        if [ "$cdnh" != "$repo_h" ]; then
                          status="200 (CDN 内容 ≠ 仓库: ${cdnh:0:12}… vs ${repo_h:0:12}… @ $rel)"
                        fi
                      fi
                      ;;
                  esac
                fi
                rm -f "$tmp"
              fi
              # kelee.one 全局 403 是 Turnstile 保护，Loon 客户端可拉取，CI 视作健康
              local key
              key=$(printf '%s' "$name" | sha256sum); key=${key%% *}
              {
                echo "::group::$name"
                echo "URL: $url"
                echo "Status: $status"
                echo "::endgroup::"
              } > "$RESULTS_DIR/$key.log"
              # TSV 累积 (落盘, 后缀 .tsv 与 .log 日志区分 — 聚合时只取 .tsv)。
              # name/status/url 三者均不含制表符 (name 为本文件
              # 字面量; status 来自 %{http_code} 或固定串), 故制表符是安全分隔符。
              printf '%s\t%s\t%s\n' "$name" "$status" "$url" > "$RESULTS_DIR/$key.tsv"
            ) &
          }


          # 客户端直连源 (未镜像, Loon [General] 拉取, 挂了报 DNS/geoip 错误)
          # 2026-09-29 P2-6: 这条按 *.mmdb 走 check_url 内的内容完整性校验
          # (体积 ≥5MB + 尾部 MaxMind marker), 状态码 200 但内容不是 mmdb 同样判红。
          # 2026-09-29 移除: 原先还探活 P3TERX GeoLite2-ASN.mmdb, 但同轮审计已确认
          # didi-pro 的 3 条 IP-ASN 规则是死规则(本地 GEOIP,CN 优先于插件 [Rule]),
          # ipasn-url 已随之删除 —— 探活一个已不被引用的文件无意义, 每次还白下 12MB。
          check_url "Loyalsoldier GeoIP mmdb" "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb"

          # 自建 CDN 可用性 —— 必须指向**当前仍在引用**的资源。客户端每次启动都会
          # 从这里拉插件与脚本, 挂了即全部去广告能力失效。目标由
          # test/cases/upstream-coverage.test.js 的双向覆盖断言锁死。
          check_url "ws.wenn.in CDN (Plugin)" "https://ws.wenn.in/main/Plugin/qidian.plugin"
          check_url "ws.wenn.in CDN (Scripts)" "https://ws.wenn.in/main/Scripts/Qidian.js"
          # 2026-09-30: Profile 是用户**真正导入**的那个文件 —— 与插件同一条内容哈希通道
          # (URL 去前缀即 Profile/Loon.lcf, 自动比对 sha256)。地址由 APP-ONBOARDING
          # 「0. 分发与验真」公开声明, upstream-coverage 用例双向断言(必须被声明且被探活)。
          check_url "ws.wenn.in CDN (Profile)" "https://ws.wenn.in/main/Profile/Loon.lcf"

          # 2026-09-30: 插件接入 [Plugin] 段(6 个: L0 三项 + qidian + jd + probe-block)
          # 后, 它们从"仓库里的文件"变成"客户端每次启动拉取的资源" ——
          # 不探活则 CDN 404/被投毒时无人告警, 而配置本身仍然语法合法、门禁全绿。
          # 双向覆盖由 test/cases/upstream-coverage.test.js 锁定: 此处每加一条, 模板
          # [Plugin] 段必须有对应引用; 反过来模板新增引用而此处漏加会判红。
          # 2026-09-30: 7 个 ad-* 合并为 1 个 ad-block 集合插件; 同日架构分层再增
          # dns-httpdns / dns-leak 两个 L0 依赖层插件 ⇒ 插件探活 10 条
          # (qidian 在上一区, 加 Scripts 共 11 条 URL, 与模板 [Plugin] 段一一对应)。
          # 2026-09-30 架构分层: L0 依赖层新增 dns-httpdns / dns-leak —— 它们与广告平台
          # 拦截器同属"所有去广告插件的前置条件", 挂掉即加密 DNS/HTTPDNS 绕过面回归, 必须探活。
          check_url "ws.wenn.in CDN (ad-block)" "https://ws.wenn.in/main/Plugin/ad-block.plugin"
          check_url "ws.wenn.in CDN (dns-httpdns)" "https://ws.wenn.in/main/Plugin/dns-httpdns.plugin"
          check_url "ws.wenn.in CDN (dns-leak)" "https://ws.wenn.in/main/Plugin/dns-leak.plugin"
          check_url "ws.wenn.in CDN (probe-block)" "https://ws.wenn.in/main/Plugin/probe-block.plugin"
          check_url "ws.wenn.in CDN (jd)" "https://ws.wenn.in/main/Plugin/jd.plugin"

          # 当前无第三方 GitHub 直连脚本 (决定: 暂时只留自己维护的)。若日后重新集成,
          # 须同时在 Plugin/ 加 script-path 引用 + 在此加 check_url, 二者缺一判红。

          # 收敛: 等全部后台探活完成, 按序回放日志, 再从落盘结果重建 TSV 与 ALL_OK。
          # (2026-09-18 性能审计: 后台任务内赋值在父 shell 不可见, 故结果必须走文件。)
          wait
          for f in "$RESULTS_DIR"/*.log; do cat "$f"; done
          RESULTS_TSV=$(cat "$RESULTS_DIR"/*.tsv 2>/dev/null || true)
          ALL_OK=true
          while IFS=$'\t' read -r _name status _url; do
            [ -z "$_name" ] && continue
            if [ "$status" != "200" ]  && [ "$status" != "302" ] && [ "$status" != "301" ]; then
              ALL_OK=false
            fi
          done <<< "$RESULTS_TSV"
          rm -rf "$RESULTS_DIR"

          # 单次转换 TSV → JSON (数据走 stdin, 不经 node 源码插值)。
          # 用 indexOf 而非 split("\t"): url 若含制表符也不会被截断 (末段整体保留)。
          RESULTS=$(printf '%s' "$RESULTS_TSV" | node -e '
            const r = [];
            for (const line of require("fs").readFileSync(0, "utf8").split("\n")) {
              if (!line) continue;
              const i = line.indexOf("\t"), j = line.indexOf("\t", i + 1);
              r.push({ name: line.slice(0, i), status: line.slice(i + 1, j), url: line.slice(j + 1) });
            }
            console.log(JSON.stringify(r));
          ')

          echo "all_ok=$ALL_OK" >> $GITHUB_ENV
          echo "results=$RESULTS" >> $GITHUB_ENV

      - name: Report results
        env:
          RESULTS: ${{ env.results }}
        run: |
          echo "### Upstream Health Report" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          node -e '
            const r = JSON.parse(process.env.RESULTS);
            for (const e of r) {
              const ok = e.status === "200" || e.status === "301" || e.status === "302";
              const icon = ok ? "✅" : "❌";
              console.log(`| ${icon} ${e.name} | ${e.status} |`);
            }
          ' >> $GITHUB_STEP_SUMMARY

      - name: Create issue if upstreams down
        if: env.all_ok != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const results = JSON.parse(process.env.results);
            const failed = results.filter(r => r.status !== "200" && r.status !== "301" && r.status !== "302" && !r.status.startsWith("200 (kelee"));
            const rows = failed.map(r => `| ❌ ${r.name} | ${r.status} |`).join('\n');
            const report = `## ⚠️ Upstream Health Alert\n\n| Downstream | Status |\n|----------|--------|\n${rows}\n`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['upstream-health']
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Upstream Health Alert',
                body: report,
                labels: ['upstream-health']
              });
            }

      - name: Close issue if upstreams recovered
        if: env.all_ok == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['upstream-health']
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ All upstreams have recovered. Closing this alert.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
