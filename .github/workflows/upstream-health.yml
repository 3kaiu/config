name: Upstream Health Check

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-upstreams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check all upstream URLs
        id: check
        run: |
          ALL_OK=true
          RESULTS="[]"

          check_url() {
            local name="$1" url="$2"
            local status
            status=$(curl -fsSL -m 30 -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "::group::$name"
            echo "URL: $url"
            echo "Status: $status"
            echo "::endgroup::"
            RESULTS=$(echo "$RESULTS" | node -e "
              const r = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              r.push({name: '$name', status: '$status', url: '$url'});
              console.log(JSON.stringify(r));
            ")
            if [ "$status" != "200" ] && [ "$status" != "302" ] && [ "$status" != "301" ]; then
              ALL_OK=false
            fi
          }

          # 核心上游
          check_url "ddgksf2013/Rewrite" "https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/KeepAds.conf"
          check_url "Maasea/sgmodule (YouTube)" "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js"
          check_url "app2smile/rules (Bilibili)" "https://raw.githubusercontent.com/app2smile/rules/master/js/bilibili-json.js"
          check_url "blackmatrix7 AllInOne" "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/Loon/AllInOne/AllInOne.plugin"

          # 自建 CDN
          check_url "ws.wenn.in CDN (Mirror)" "https://ws.wenn.in/main/Mirror/netease.adblock.js"

          # 脚本级上游 (已 Mirror, 监控原站)
          check_url "ddgksf2013 gist (netease)" "https://gist.githubusercontent.com/ddgksf2013/4f53b7c6083678df25fecc8ff68b52c4/raw/netease.adblock.js"
          check_url "ddgksf2013/Scripts amdc.js" "https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/amdc.js"
          check_url "ddgksf2013/Scripts applet.js" "https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/applet.js"

          # NSRingo Apple 增强 (5 仓库)
          check_url "NSRingo WeatherKit" "https://github.com/NSRingo/WeatherKit/releases/latest/download/iRingo.WeatherKit.plugin"
          check_url "NSRingo Maps" "https://github.com/NSRingo/Maps/releases/latest/download/iRingo.Maps.plugin"
          check_url "NSRingo News" "https://github.com/NSRingo/News/releases/latest/download/iRingo.News.plugin"
          check_url "NSRingo Siri" "https://github.com/NSRingo/Siri/releases/latest/download/iRingo.Siri.plugin"
          check_url "NSRingo TestFlight" "https://github.com/NSRingo/TestFlight/releases/latest/download/iRingo.TestFlight.plugin"

          # NSRingo bundle.js (version-pinned)
          check_url "NSRingo bundle WeatherKit" "https://github.com/NSRingo/WeatherKit/releases/download/v3.1.0/response.bundle.js"
          check_url "NSRingo bundle GeoServices req" "https://github.com/NSRingo/GeoServices/releases/download/v4.6.1/request.bundle.js"
          check_url "NSRingo bundle GeoServices res" "https://github.com/NSRingo/GeoServices/releases/download/v4.6.1/response.bundle.js"
          check_url "NSRingo bundle News" "https://github.com/NSRingo/News/releases/download/v3.2.1/request.bundle.js"
          check_url "NSRingo bundle Siri req" "https://github.com/NSRingo/Siri/releases/download/v4.2.7/request.bundle.js"
          check_url "NSRingo bundle Siri res" "https://github.com/NSRingo/Siri/releases/download/v4.2.7/response.bundle.js"
          check_url "NSRingo bundle TestFlight req" "https://github.com/NSRingo/TestFlight/releases/download/v3.4.0/request.bundle.js"
          check_url "NSRingo bundle TestFlight res" "https://github.com/NSRingo/TestFlight/releases/download/v3.4.0/response.bundle.js"

          echo "all_ok=$ALL_OK" >> $GITHUB_ENV
          echo "results=$RESULTS" >> $GITHUB_ENV

      - name: NSRingo version staleness check
        run: |
          echo "### NSRingo Version Staleness" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Pinned | Latest Release | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|----------------|--------|" >> $GITHUB_STEP_SUMMARY

          check_nsringo() {
            local name="$1" pinned="$2" repo="$3"
            local latest_tag
            latest_tag=$(curl -fsSL -m 15 -o /dev/null -w "%{redirect_url}" \
              "https://github.com/$repo/releases/latest" 2>/dev/null | sed 's#.*/v\?##' || echo "unknown")
            if [ "$latest_tag" = "unknown" ]; then
              echo "| $name | $pinned | fetch failed | ⚠️ |" >> $GITHUB_STEP_SUMMARY
            elif [ "$latest_tag" = "$pinned" ]; then
              echo "| $name | $pinned | $latest_tag | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | $pinned | **$latest_tag** | 🆕 update |" >> $GITHUB_STEP_SUMMARY
            fi
          }

          check_nsringo "WeatherKit" "v3.1.0" "NSRingo/WeatherKit"
          check_nsringo "GeoServices" "v4.6.1" "NSRingo/GeoServices"
          check_nsringo "News" "v3.2.1" "NSRingo/News"
          check_nsringo "Siri" "v4.2.7" "NSRingo/Siri"
          check_nsringo "TestFlight" "v3.4.0" "NSRingo/TestFlight"
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Report results
        run: |
          echo "### Upstream Health Report" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.results }}" | node -e '
            const r = JSON.parse(process.argv[1]);
            for (const e of r) {
              const icon = e.status === "200" || e.status === "301" || e.status === "302" ? "✅" : "❌";
              console.log(`| ${icon} ${e.name} | ${e.status} |`);
            }
          ' "${{ env.results }}" | while read line; do echo "$line" >> $GITHUB_STEP_SUMMARY; done

      - name: Create issue if upstreams down
        if: env.all_ok != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const results = JSON.parse(process.env.results);
            const failed = results.filter(r => r.status !== "200" && r.status !== "301" && r.status !== "302");
            const rows = failed.map(r => `| ❌ ${r.name} | ${r.status} |`).join('\n');
            const report = `## ⚠️ Upstream Health Alert\n\n| Downstream | Status |\n|----------|--------|\n${rows}\n`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['upstream-health']
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Upstream Health Alert',
                body: report,
                labels: ['upstream-health']
              });
            }

      - name: Close issue if upstreams recovered
        if: env.all_ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['upstream-health']
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ All upstreams have recovered. Closing this alert.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
