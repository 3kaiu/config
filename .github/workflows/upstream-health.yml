name: Upstream Health Check

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  # checkout 需要: MANIFEST 派生探活读取仓库文件
  contents: read

jobs:
  check-upstreams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # MANIFEST 派生检查依赖仓库文件; 缺 checkout 会 ENOENT 静默跳过全部镜像探活
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check all upstream URLs
        id: check
        run: |
          ALL_OK=true
          RESULTS="[]"

          check_url() {
            local name="$1" url="$2"
            local status
            # 不用 -f: 失败状态码 (403/404) 也要拿到真实数字; 网络层异常时才记 000
            status=$(curl -sSL -m 30 -o /dev/null -w "%{http_code}" "$url" || true)
            [ -z "$status" ] && status="000"
            echo "::group::$name"
            echo "URL: $url"
            echo "Status: $status"
            echo "::endgroup::"
            RESULTS=$(echo "$RESULTS" | node -e "
              const r = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              r.push({name: '$name', status: '$status', url: '$url'});
              console.log(JSON.stringify(r));
            ")
            if [ "$status" != "200" ] && [ "$status" != "302" ] && [ "$status" != "301" ]; then
              ALL_OK=false
            fi
          }

          # 镜像上游探活全部由下方 MANIFEST 派生循环覆盖 (35 条, 单一权威清单);
          # 此处仅保留"未被镜像"的直连依赖 — 硬编码块勿新增镜像内条目 (2026-08 审计去重)

          # 客户端直连源 (未镜像, Loon [General] 拉取, 挂了报 DNS/geoip 错误)
          check_url "Loyalsoldier GeoIP mmdb" "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb"
          check_url "P3TERX GeoLite2-ASN mmdb" "https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-ASN.mmdb"

          # 自建 CDN 可用性 (内容哈希校验在 cdn-verify.yml, 这里只探活)
          check_url "ws.wenn.in CDN (Mirror)" "https://ws.wenn.in/main/Mirror/netease.adblock.js"

          # 免费代理源 (proxy-sync 每日拉取 → Profile/*.loon.txt, Loon [Remote Proxy] 引用)
          check_url "proxylist.geonode.com API" "https://proxylist.geonode.com/api/proxy-list?page=1&limit=1&sort_by=responseTime&sort_type=asc"
          check_url "iplocate/free-proxy-list http" "https://raw.githubusercontent.com/iplocate/free-proxy-list/main/protocols/http.txt"
          check_url "iplocate/free-proxy-list socks5" "https://raw.githubusercontent.com/iplocate/free-proxy-list/main/protocols/socks5.txt"
          check_url "hproxy-com/free-proxy-list all.json" "https://raw.githubusercontent.com/hproxy-com/free-proxy-list/main/all.json"
          check_url "TheSpeedX/PROXY-List http" "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt"
          check_url "TheSpeedX/PROXY-List socks5" "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt"
          check_url "roosterkid/openproxylist https" "https://raw.githubusercontent.com/roosterkid/openproxylist/main/HTTPS_RAW.txt"
          check_url "ws.wenn.in CDN (Geonode 订阅)" "https://ws.wenn.in/main/Profile/geonode.loon.txt"
          check_url "ws.wenn.in CDN (Edu 订阅)" "https://ws.wenn.in/main/Profile/edu-proxy.loon.txt"

          # kelee.one LPX (loon.tpl 直连的第三方配置, 未镜像; 2026-08 起全局 403 见 issue #27)
          check_url "kelee.one LPX Google" "https://kelee.one/Tool/Loon/Lpx/Google.lpx"
          check_url "kelee.one LPX JD_Price" "https://kelee.one/Tool/Loon/Lpx/JD_Price.lpx"
          check_url "kelee.one LPX Node_detection_tool" "https://kelee.one/Tool/Loon/Lpx/Node_detection_tool.lpx"
          check_url "kelee.one LPX NodeLinkCheck" "https://kelee.one/Tool/Loon/Lpx/NodeLinkCheck.lpx"
          check_url "kelee.one LPX Spotify_lyrics" "https://kelee.one/Tool/Loon/Lpx/Spotify_lyrics_translation.lpx"
          check_url "kelee.one LPX VVebo_repair" "https://kelee.one/Tool/Loon/Lpx/VVebo_repair.lpx"
          check_url "kelee.one LPX Weixin_links" "https://kelee.one/Tool/Loon/Lpx/Weixin_external_links_unlock.lpx"

          # 镜像上游 (单一权威清单: Mirror/MANIFEST.json — 新增镜像自动纳入, 勿在此重复硬编码)
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("Mirror/MANIFEST.json", "utf8"));
            for (const [f, meta] of Object.entries(m.files)) {
              console.log(f + "\t" + meta.source_url);
            }
          ' | while IFS=$'\t' read -r name url; do check_url "$name (mirrored)" "$url"; done

          echo "all_ok=$ALL_OK" >> $GITHUB_ENV
          echo "results=$RESULTS" >> $GITHUB_ENV

      - name: Report results
        env:
          RESULTS: ${{ env.results }}
        run: |
          echo "### Upstream Health Report" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          node -e '
            const r = JSON.parse(process.env.RESULTS);
            for (const e of r) {
              const icon = e.status === "200" || e.status === "301" || e.status === "302" ? "✅" : "❌";
              console.log(`| ${icon} ${e.name} | ${e.status} |`);
            }
          ' >> $GITHUB_STEP_SUMMARY

      - name: Create issue if upstreams down
        if: env.all_ok != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const results = JSON.parse(process.env.results);
            const failed = results.filter(r => r.status !== "200" && r.status !== "301" && r.status !== "302");
            const rows = failed.map(r => `| ❌ ${r.name} | ${r.status} |`).join('\n');
            const report = `## ⚠️ Upstream Health Alert\n\n| Downstream | Status |\n|----------|--------|\n${rows}\n`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['upstream-health']
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Upstream Health Alert',
                body: report,
                labels: ['upstream-health']
              });
            }

      - name: Close issue if upstreams recovered
        if: env.all_ok == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['upstream-health']
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ All upstreams have recovered. Closing this alert.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
