name: Upstream Health Check

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  # checkout 需要: MANIFEST 派生探活读取仓库文件
  contents: read

jobs:
  check-upstreams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # MANIFEST 派生检查依赖仓库文件; 缺 checkout 会 ENOENT 静默跳过全部镜像探活
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check all upstream URLs
        id: check
        run: |
          ALL_OK=true
          RESULTS="[]"

          check_url() {
            local name="$1" url="$2"
            local status
            # 不用 -f: 失败状态码 (403/404) 也要拿到真实数字; 网络层异常时才记 000
            status=$(curl -sSL -m 30 -o /dev/null -w "%{http_code}" "$url" || true)
            [ -z "$status" ] && status="000"
            echo "::group::$name"
            echo "URL: $url"
            echo "Status: $status"
            echo "::endgroup::"
            RESULTS=$(echo "$RESULTS" | node -e "
              const r = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              r.push({name: '$name', status: '$status', url: '$url'});
              console.log(JSON.stringify(r));
            ")
            if [ "$status" != "200" ] && [ "$status" != "302" ] && [ "$status" != "301" ]; then
              ALL_OK=false
            fi
          }

          # 核心上游
          check_url "ddgksf2013/Rewrite" "https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/KeepAds.conf"
          check_url "Maasea/sgmodule (YouTube)" "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js"
          check_url "app2smile/rules (Bilibili)" "https://raw.githubusercontent.com/app2smile/rules/master/js/bilibili-json.js"
          check_url "blackmatrix7 AllInOne" "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/Loon/AllInOne/AllInOne.plugin"

          # Loon.lcf [General] 直连源 (客户端侧拉取, 挂了会报 DNS/geoip 错误)
          check_url "Loyalsoldier GeoIP mmdb" "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb"
          check_url "P3TERX GeoLite2-ASN mmdb" "https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-ASN.mmdb"

          # 自建 CDN
          check_url "ws.wenn.in CDN (Mirror)" "https://ws.wenn.in/main/Mirror/netease.adblock.js"

          # 免费代理源 (proxy-sync 每日拉取 → Profile/*.loon.txt, Loon [Remote Proxy] 引用)
          check_url "proxylist.geonode.com API" "https://proxylist.geonode.com/api/proxy-list?page=1&limit=1&sort_by=responseTime&sort_type=asc"
          check_url "iplocate/free-proxy-list http" "https://raw.githubusercontent.com/iplocate/free-proxy-list/main/protocols/http.txt"
          check_url "iplocate/free-proxy-list socks5" "https://raw.githubusercontent.com/iplocate/free-proxy-list/main/protocols/socks5.txt"
          check_url "hproxy-com/free-proxy-list all.json" "https://raw.githubusercontent.com/hproxy-com/free-proxy-list/main/all.json"
          check_url "TheSpeedX/PROXY-List http" "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt"
          check_url "TheSpeedX/PROXY-List socks5" "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt"
          check_url "roosterkid/openproxylist https" "https://raw.githubusercontent.com/roosterkid/openproxylist/main/HTTPS_RAW.txt"
          check_url "ws.wenn.in CDN (Geonode 订阅)" "https://ws.wenn.in/main/Profile/geonode.loon.txt"
          check_url "ws.wenn.in CDN (Edu 订阅)" "https://ws.wenn.in/main/Profile/edu-proxy.loon.txt"

          # 脚本级上游 (已 Mirror, 监控原站 — 列表派生自 Mirror/MANIFEST.json, 勿重复维护)
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("Mirror/MANIFEST.json", "utf8"));
            for (const [f, meta] of Object.entries(m.files)) {
              console.log(f + "\t" + meta.source_url);
            }
          ' | while IFS=$'\t' read -r name url; do check_url "$name (mirrored)" "$url"; done

          # NSRingo Apple 增强
          # WeatherKit 自 v3.2.0 起不再发布 .plugin 资产 (仅 .lpx/.sgmodule/.snippet/.stoverride),
          # 健康探活改查 bundle.js, 避免误报 404
          check_url "NSRingo WeatherKit" "https://github.com/NSRingo/WeatherKit/releases/latest/download/response.bundle.js"
          check_url "NSRingo MapKit" "https://github.com/NSRingo/MapKit/releases/latest/download/iRingo.Maps.plugin"
          check_url "NSRingo News" "https://github.com/NSRingo/News/releases/latest/download/iRingo.News.plugin"
          check_url "NSRingo Siri" "https://github.com/NSRingo/Siri/releases/latest/download/iRingo.Siri.plugin"
          check_url "NSRingo TestFlight" "https://github.com/NSRingo/TestFlight/releases/latest/download/iRingo.TestFlight.plugin"
          check_url "NSRingo TV" "https://github.com/NSRingo/TV/releases/latest/download/iRingo.TV.plugin"
          check_url "NSRingo LocationServices" "https://github.com/NSRingo/LocationServices/releases/latest/download/iRingo.LocationService.plugin"

          # NSRingo bundle.js (latest, 跟随上游最新版本)
          check_url "NSRingo bundle WeatherKit req" "https://github.com/NSRingo/WeatherKit/releases/latest/download/request.bundle.js"
          check_url "NSRingo bundle WeatherKit res" "https://github.com/NSRingo/WeatherKit/releases/latest/download/response.bundle.js"
          check_url "NSRingo bundle GeoServices req" "https://github.com/NSRingo/GeoServices/releases/latest/download/request.bundle.js"
          check_url "NSRingo bundle GeoServices res" "https://github.com/NSRingo/GeoServices/releases/latest/download/response.bundle.js"
          check_url "NSRingo bundle News req" "https://github.com/NSRingo/News/releases/latest/download/request.bundle.js"
          # News response.bundle.js 探活已移除: 上游 v3.2.1 起不再发布该文件 (永久 404 误报)
          check_url "NSRingo bundle Siri req" "https://github.com/NSRingo/Siri/releases/latest/download/request.bundle.js"
          check_url "NSRingo bundle Siri res" "https://github.com/NSRingo/Siri/releases/latest/download/response.bundle.js"
          check_url "NSRingo bundle TestFlight req" "https://github.com/NSRingo/TestFlight/releases/latest/download/request.bundle.js"
          check_url "NSRingo bundle TestFlight res" "https://github.com/NSRingo/TestFlight/releases/latest/download/response.bundle.js"
          check_url "NSRingo bundle TV req" "https://github.com/NSRingo/TV/releases/latest/download/request.bundle.js"
          check_url "NSRingo bundle TV res" "https://github.com/NSRingo/TV/releases/latest/download/response.bundle.js"
          check_url "NSRingo bundle LocationServices req" "https://github.com/NSRingo/LocationServices/releases/latest/download/request.bundle.js"
          check_url "NSRingo bundle LocationServices res" "https://github.com/NSRingo/LocationServices/releases/latest/download/response.bundle.js"

          # DualSubs (双语字幕)
          check_url "DualSubs Universal" "https://github.com/DualSubs/Universal/releases/latest/download/DualSubs.Universal.plugin"
          check_url "DualSubs YouTube" "https://github.com/DualSubs/YouTube/releases/latest/download/DualSubs.YouTube.plugin"
          check_url "DualSubs Netflix" "https://github.com/DualSubs/Netflix/releases/latest/download/DualSubs.Netflix.plugin"

          # Auraflare (Cloudflare 资源集成)
          check_url "Auraflare 1.1.1.1" "https://raw.githubusercontent.com/Auraflare/1.1.1.1/main/modules/Cloudflare.1.1.1.1.plugin"
          check_url "Auraflare DNS" "https://github.com/Auraflare/DNS/releases/latest/download/Cloudflare.DNS.plugin"

          # BiliUniverse (哔哩哔哩增强)
          check_url "BiliUniverse Enhanced" "https://github.com/BiliUniverse/Enhanced/releases/latest/download/BiliBili.Enhanced.plugin"
          check_url "BiliUniverse Global" "https://github.com/BiliUniverse/Global/releases/latest/download/BiliBili.Global.plugin"
          check_url "BiliUniverse ADBlock" "https://github.com/BiliUniverse/ADBlock/releases/latest/download/BiliBili.ADBlock.plugin"
          check_url "BiliUniverse Redirect" "https://github.com/BiliUniverse/Redirect/releases/latest/download/BiliBili.Redirect.plugin"

          # kelee.one LPX (loon.tpl 直连的第三方配置, 非 CDN 链路)
          check_url "kelee.one LPX Google" "https://kelee.one/Tool/Loon/Lpx/Google.lpx"
          check_url "kelee.one LPX JD_Price" "https://kelee.one/Tool/Loon/Lpx/JD_Price.lpx"
          check_url "kelee.one LPX Node_detection_tool" "https://kelee.one/Tool/Loon/Lpx/Node_detection_tool.lpx"
          check_url "kelee.one LPX NodeLinkCheck" "https://kelee.one/Tool/Loon/Lpx/NodeLinkCheck.lpx"
          check_url "kelee.one LPX Spotify_lyrics" "https://kelee.one/Tool/Loon/Lpx/Spotify_lyrics_translation.lpx"
          check_url "kelee.one LPX VVebo_repair" "https://kelee.one/Tool/Loon/Lpx/VVebo_repair.lpx"
          check_url "kelee.one LPX Weixin_links" "https://kelee.one/Tool/Loon/Lpx/Weixin_external_links_unlock.lpx"

          echo "all_ok=$ALL_OK" >> $GITHUB_ENV
          echo "results=$RESULTS" >> $GITHUB_ENV

      - name: Report results
        env:
          RESULTS: ${{ env.results }}
        run: |
          echo "### Upstream Health Report" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          node -e '
            const r = JSON.parse(process.env.RESULTS);
            for (const e of r) {
              const icon = e.status === "200" || e.status === "301" || e.status === "302" ? "✅" : "❌";
              console.log(`| ${icon} ${e.name} | ${e.status} |`);
            }
          ' >> $GITHUB_STEP_SUMMARY

      - name: Create issue if upstreams down
        if: env.all_ok != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const results = JSON.parse(process.env.results);
            const failed = results.filter(r => r.status !== "200" && r.status !== "301" && r.status !== "302");
            const rows = failed.map(r => `| ❌ ${r.name} | ${r.status} |`).join('\n');
            const report = `## ⚠️ Upstream Health Alert\n\n| Downstream | Status |\n|----------|--------|\n${rows}\n`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['upstream-health']
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Upstream Health Alert',
                body: report,
                labels: ['upstream-health']
              });
            }

      - name: Close issue if upstreams recovered
        if: env.all_ok == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['upstream-health']
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ All upstreams have recovered. Closing this alert.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
