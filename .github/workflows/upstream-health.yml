name: Upstream Health Check

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  # checkout 需要: MANIFEST 派生探活读取仓库文件
  contents: read

jobs:
  check-upstreams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # MANIFEST 派生检查依赖仓库文件; 缺 checkout 会 ENOENT 静默跳过全部镜像探活
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check all upstream URLs
        id: check
        run: |
          ALL_OK=true
          # 2026-09-11 审计 (CI-03): 原实现把 $name/$status/$url 直接插值进 node 源码
          # (`r.push({name: '$name', …})`)。值中出现单引号 / 反斜杠即破坏该 node 脚本 —
          # 上游 URL 或探活名称一旦含引号, JSON 累积链就此断裂 (静默的部分失败: 之后
          # 每条探活都报错, 而 --fail 未开, 只是结果缺失)。这既是注入面也是可靠性缺陷。
          # 另: 原实现每个 URL 起一个 node 进程 (~50 次/轮) 只为 append 一个数组元素。
          # 现改为: TSV 累积 → 循环结束后单次转换; 数据经 stdin 传递, 不经源码插值。
          RESULTS_TSV=""

          check_url() {
            local name="$1" url="$2"
            local status
            # 不用 -f: 失败状态码 (403/404) 也要拿到真实数字; 网络层异常时才记 000
            status=$(curl -sSL -m 30 -o /dev/null -w "%{http_code}" "$url" || true)
            [ -z "$status" ] && status="000"
            # kelee.one 全局 403 是 Turnstile 保护，Loon 客户端可拉取，CI 视作健康
            if [[ "$name" == *"kelee.one"* && "$status" == "403" ]]; then
              status="200 (kelee 403→Loon OK)"
            fi
            echo "::group::$name"
            echo "URL: $url"
            echo "Status: $status"
            echo "::endgroup::"
            # TSV 累积。name/status/url 三者均不含制表符 (name 来自 MANIFEST 键或本文件
            # 字面量; status 来自 %{http_code} 或固定串), 故制表符是安全分隔符。
            # 万一上游清单里出现制表符, 显式失败而不是静默错位写出坏 JSON。
            case "${name}${status}${url}" in
              *$'\t'*) echo "::error::探活字段含制表符, 无法序列化: $name"; exit 1 ;;
            esac
            RESULTS_TSV+="${name}"$'\t'"${status}"$'\t'"${url}"$'\n'
            if [ "$status" != "200" ] && [ "$status" != "200 (kelee 403→Loon OK)" ] && [ "$status" != "302" ] && [ "$status" != "301" ]; then
              ALL_OK=false
            fi
          }

          # 镜像上游探活全部由下方 MANIFEST 派生循环覆盖 (35 条, 单一权威清单);
          # 此处仅保留"未被镜像"的直连依赖 — 硬编码块勿新增镜像内条目 (2026-08 审计去重)

          # 客户端直连源 (未镜像, Loon [General] 拉取, 挂了报 DNS/geoip 错误)
          check_url "Loyalsoldier GeoIP mmdb" "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb"
          check_url "P3TERX GeoLite2-ASN mmdb" "https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-ASN.mmdb"

          # 自建 CDN 可用性 (内容哈希校验在 cdn-verify.yml, 这里只探活)
          check_url "ws.wenn.in CDN (Mirror)" "https://ws.wenn.in/main/Mirror/netease.adblock.js"

          # GOODBYEADS 客户端直连 URL (loon.tpl [Remote Rule], 3.9MB 大文件单独探活)
          # 2026-09-11 审计 (DATA-01): 原探的是 S3 带外手工上传副本。该副本与仓库内
          # Mirror/rules/goodbyeads-qx.list 同源双份、无哈希门禁且靠人工上传, 已把
          # loon.tpl 收敛到 CDN 路径 — 故探活目标随之改为客户端实际拉取的 URL。
          check_url "GOODBYEADS (Remote Rule via CDN)" "https://ws.wenn.in/main/Mirror/rules/goodbyeads-qx.list"

          # 免费代理源 (proxy-sync 每日拉取 → Profile/geonode.loon.txt, Loon [Remote Proxy] 引用)
          check_url "proxylist.geonode.com API" "https://proxylist.geonode.com/api/proxy-list?page=1&limit=1&sort_by=responseTime&sort_type=asc"
          check_url "ws.wenn.in CDN (Geonode 订阅)" "https://ws.wenn.in/main/Profile/geonode.loon.txt"

          # kelee.one LPX (loon.tpl 直连的第三方配置, 未镜像; 2026-08 起全局 403 见 issue #27，Loon 带 Turnstile 可拉取，curl 403 视为健康)
          check_url "kelee.one LPX Google" "https://kelee.one/Tool/Loon/Lpx/Google.lpx"
          check_url "kelee.one LPX JD_Price" "https://kelee.one/Tool/Loon/Lpx/JD_Price.lpx"
          check_url "kelee.one LPX Node_detection_tool" "https://kelee.one/Tool/Loon/Lpx/Node_detection_tool.lpx"
          check_url "kelee.one LPX NodeLinkCheck" "https://kelee.one/Tool/Loon/Lpx/NodeLinkCheck.lpx"
          check_url "kelee.one LPX Spotify_lyrics" "https://kelee.one/Tool/Loon/Lpx/Spotify_lyrics_translation.lpx"
          check_url "kelee.one LPX VVebo_repair" "https://kelee.one/Tool/Loon/Lpx/VVebo_repair.lpx"
          check_url "kelee.one LPX Weixin_links" "https://kelee.one/Tool/Loon/Lpx/Weixin_external_links_unlock.lpx"

          # 镜像上游 (单一权威清单: Mirror/MANIFEST.json — 新增镜像自动纳入, 勿在此重复硬编码)
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("Mirror/MANIFEST.json", "utf8"));
            for (const [f, meta] of Object.entries(m.files)) {
              console.log(f + "\t" + meta.source_url);
            }
          ' > /tmp/mirrors.tsv
          # 2026-08-29 修复 (审计 P0): 原用管道 `node ... | while read` — bash 中管道右侧 while
          # 跑在子 shell, check_url 内 ALL_OK / RESULTS 的赋值在循环结束后全部丢失。
          # 后果: 全部 MANIFEST 派生探活 (~34 条) 不写 summary、不影响 all_ok、永不触发 issue,
          # 等于硬编码之外的上游探活全是死代码。改用 /tmp 文件中转让 while 留在当前 shell。
          while IFS=$'\t' read -r name url; do check_url "$name (mirrored)" "$url"; done < /tmp/mirrors.tsv

          # 单次转换 TSV → JSON (数据走 stdin, 不经 node 源码插值)。
          # 用 indexOf 而非 split("\t"): url 若含制表符也不会被截断 (末段整体保留)。
          RESULTS=$(printf '%s' "$RESULTS_TSV" | node -e '
            const r = [];
            for (const line of require("fs").readFileSync(0, "utf8").split("\n")) {
              if (!line) continue;
              const i = line.indexOf("\t"), j = line.indexOf("\t", i + 1);
              r.push({ name: line.slice(0, i), status: line.slice(i + 1, j), url: line.slice(j + 1) });
            }
            console.log(JSON.stringify(r));
          ')

          echo "all_ok=$ALL_OK" >> $GITHUB_ENV
          echo "results=$RESULTS" >> $GITHUB_ENV

      - name: Report results
        env:
          RESULTS: ${{ env.results }}
        run: |
          echo "### Upstream Health Report" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          node -e '
            const r = JSON.parse(process.env.RESULTS);
            for (const e of r) {
              const ok = e.status === "200" || e.status === "301" || e.status === "302" || e.status.startsWith("200 (kelee");
              const icon = ok ? "✅" : "❌";
              console.log(`| ${icon} ${e.name} | ${e.status} |`);
            }
          ' >> $GITHUB_STEP_SUMMARY

      - name: Create issue if upstreams down
        if: env.all_ok != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const results = JSON.parse(process.env.results);
            const failed = results.filter(r => r.status !== "200" && r.status !== "301" && r.status !== "302" && !r.status.startsWith("200 (kelee"));
            const rows = failed.map(r => `| ❌ ${r.name} | ${r.status} |`).join('\n');
            const report = `## ⚠️ Upstream Health Alert\n\n| Downstream | Status |\n|----------|--------|\n${rows}\n`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['upstream-health']
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Upstream Health Alert',
                body: report,
                labels: ['upstream-health']
              });
            }

      - name: Close issue if upstreams recovered
        if: env.all_ok == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['upstream-health']
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ All upstreams have recovered. Closing this alert.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
