# 脚本回归测试 (中期演进 #1: 测试基建)
# 零依赖, vm 沙箱模拟 Loon/QX 运行时, 覆盖净化类脚本与 Qidian 包装层核心逻辑
name: Script Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint source files
        run: npm run lint

      - name: Build scripts
        run: npm run build

      - name: Run script tests
        run: node test/run-tests.js
