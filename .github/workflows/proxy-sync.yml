name: Proxy List Sync

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/geonode-sync.mjs'

# 2026-08-29 审计: 直推 main, 并发时非 fast-forward 直接 job 红。
concurrency:
  group: proxy-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # 超时预算: 上游拉取 30s + 探测 200 候选 × 8s / 并发 15 ≈ 90s, 余量给 git push
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Sync geonode proxies
        id: geonode
        continue-on-error: true
        run: node tools/geonode-sync.mjs

      # 单源: 失败即整体失败 — geonode-sync 自身会保留旧文件并 exit 1, 这里不再兜底
      - name: Fail if sync failed
        if: steps.geonode.outcome == 'failure'
        run: |
          echo "❌ geonode 同步失败, 保留旧文件" >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Commit if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Profile/geonode.loon.txt
          if git diff --cached --quiet; then
            echo "无变更, 跳过提交"
            echo "synced=false" >> $GITHUB_ENV
            exit 0
          fi
          git commit -m "chore(proxy): 免费代理列表同步 ($(date +%Y-%m-%d))"
          git push origin main
          echo "synced=true" >> $GITHUB_ENV

      - name: Report summary
        if: always()
        run: |
          GEO_ICON=✅
          [ "${{ steps.geonode.outcome }}" = "failure" ] && GEO_ICON=❌
          echo "### Proxy List Sync Report" >> $GITHUB_STEP_SUMMARY
          echo "| Date | Geonode | Synced |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| $(date +%Y-%m-%d) | ${GEO_ICON:-✅} | ${synced:-false} |" >> $GITHUB_STEP_SUMMARY
