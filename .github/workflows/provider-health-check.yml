name: Provider Health Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分钟检查一次
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate multi-provider config
        run: |
          node config/providers/multi-provider.config.js
      
      - name: Check Primary Provider Health
        id: primary
        run: |
          echo "Checking primary provider..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "${{ vars.SURGIO_PRIMARY_URL }}/health" 2>/dev/null || echo "000")
          
          if [ "$RESPONSE" == "200" ]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "✓ Primary provider is healthy"
          else
            echo "status=unhealthy" >> $GITHUB_OUTPUT
            echo "✗ Primary provider response: $RESPONSE"
          fi
        
        env:
          SURGIO_PRIMARY_URL: ${{ vars.SURGIO_PRIMARY_URL }}
      
      - name: Check Secondary Provider Health (if primary unhealthy)
        if: steps.primary.outputs.status != 'healthy'
        id: secondary
        run: |
          echo "Checking secondary provider..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "${{ vars.SURGIO_SECONDARY_URL }}/health" 2>/dev/null || echo "000")
          
          if [ "$RESPONSE" == "200" ]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "✓ Secondary provider is healthy"
          else
            echo "status=unhealthy" >> $GITHUB_OUTPUT
            echo "✗ Secondary provider response: $RESPONSE"
          fi
        
        env:
          SURGIO_SECONDARY_URL: ${{ vars.SURGIO_SECONDARY_URL }}
      
      - name: Failover Alert
        if: steps.primary.outputs.status != 'healthy' && (steps.secondary.outputs.status != 'healthy' || steps.secondary.outputs.status == '')
        run: |
          echo "🚨 ALERT: Both providers are unhealthy!"
          echo "Triggering failover notification..."
          curl -X POST ${{ secrets.ALERT_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"⚠️ Surgeo providers health check failed! Current status: Primary=${{ steps.primary.outputs.status }}, Secondary=${{ steps.secondary.outputs.status }}\"}"
        
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
      
      - name: Generate Health Report
        run: |
          cat > output/health-report.md << EOF
          # Provider Health Report
          
          **Timestamp**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Workflow Run**: ${{ github.run_id }}
          
          ## Status Summary
          | Provider | Status | Response Code |
          |----------|--------|---------------|
          | Primary  | ${{ steps.primary.outputs.status }} | ${{ steps.primary.outcome }} |
          | Secondary| ${{ steps.secondary.outputs.status || 'N/A' }} | N/A |
          
          ## Notes
          - Health checks run every 5 minutes
          - Alerts triggered when both providers are unhealthy
          EOF
          
          mkdir -p output
          echo "# Provider Health Report" > output/health-report.md
          echo "" >> output/health-report.md
          echo "**Timestamp**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> output/health-report.md
          echo "" >> output/health-report.md
          echo "| Provider | Status |" >> output/health-report.md
          echo "|----------|--------|" >> output/health-report.md
          echo "| Primary  | ${{ steps.primary.outputs.status }} |" >> output/health-report.md
          echo "| Secondary| ${{ steps.secondary.outputs.status || 'N/A' }} |" >> output/health-report.md

      - name: Upload Health Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-health-report
          path: output/health-report.md
          retention-days: 7
