# ⚠️ 版本固定: v1.0.1 — 如 NSRingo 清理旧 release 此配置将 404。建议定期检查最新版。
# ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# iRingo LocationService QX 模块 (从 NSRingo/LocationService .plugin 转换)
# 自定义定位服务内容, 添加国际版功能 (iOS 15+)
# 注意: QX 不支持 argument 传递, 参数需通过 BoxJS 配置
# 源: https://github.com/NSRingo/LocationService

[filter_local]
host, gspe1-ssl.ls.apple.com, direct
host, dispatcher.is.autonavi.com, direct

[rewrite_local]
^https?:\/\/gspe1-ssl\.ls\.apple\.com\/pep\/gcc url script-response-body https://ws.wenn.in/main/Mirror/nsringo/LocationServices-v1.0.1-response.bundle.js
^https?:\/\/dispatcher\.is\.autonavi\.com\/dispatcher url script-request-body https://ws.wenn.in/main/Mirror/nsringo/LocationServices-v1.0.1-request.bundle.js
^https?:\/\/dispatcher\.is\.autonavi\.com\/dispatcher url script-response-body https://ws.wenn.in/main/Mirror/nsringo/LocationServices-v1.0.1-response.bundle.js

[mitm]
hostname = gspe1-ssl.ls.apple.com, dispatcher.is.autonavi.com
