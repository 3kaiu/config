# ⚠️ 版本固定: v4.2.7 — 如 NSRingo 清理旧 release 此配置将 404。建议定期检查最新版。
# ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# iRingo Search QX 模块 (从 NSRingo/Siri .plugin 转换)
# 全面自定义「Siri 建议」功能 (iOS/iPadOS/macOS)
# 注意: QX 不支持 argument 传递, 参数需通过 BoxJS 配置
# 源: https://github.com/NSRingo/Siri

[rewrite_local]
^https?:\/\/api2?\.smoot\.apple\.(com|cn)\/bag url script-request-body https://ws.wenn.in/main/Mirror/nsringo/Siri-v4.2.7-request.bundle.js
^https?:\/\/api2?\.smoot\.apple\.(com|cn)\/bag url script-response-body https://ws.wenn.in/main/Mirror/nsringo/Siri-v4.2.7-response.bundle.js
^https?:\/\/api(2|-.+)\.smoot\.apple\.(com|cn)\/search url script-request-body https://ws.wenn.in/main/Mirror/nsringo/Siri-v4.2.7-request.bundle.js
^https?:\/\/api(2|-.+)\.smoot\.apple\.(com|cn)\/flight url script-request-body https://ws.wenn.in/main/Mirror/nsringo/Siri-v4.2.7-request.bundle.js

[mitm]
hostname = api*.smoot.apple.com, api.smoot.apple.cn
