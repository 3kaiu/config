# ⚠️ 版本固定: v3.4.4 — 如 NSRingo 清理旧 release 此配置将 404。建议定期检查最新版。
# ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# iRingo TV QX 模块 (从 NSRingo/TV .plugin 转换)
# 全面自定义「TV app」功能 (iOS/iPadOS/tvOS/macOS)
# 注意: QX 不支持 argument 传递, 参数需通过 BoxJS 配置
# 源: https://github.com/NSRingo/TV

[filter_local]
host, known-issues.apple.com, reject

[rewrite_local]
^https?:\/\/uts-api\.itunes\.apple\.com\/uts\/(v1|v2|v3)\/ url script-request-body https://ws.wenn.in/main/Mirror/nsringo/TV-v3.4.4-request.bundle.js
^https?:\/\/uts-api\.itunes\.apple\.com\/uts\/(v1|v2|v3)\/ url script-response-body https://ws.wenn.in/main/Mirror/nsringo/TV-v3.4.4-response.bundle.js
^https?:\/\/umc-tempo-api\.apple\.com\/(v1|v2|v3)\/ url script-request-body https://ws.wenn.in/main/Mirror/nsringo/TV-v3.4.4-request.bundle.js

[mitm]
hostname = uts-api.itunes.apple.com, umc-tempo-api.apple.com, play-cdn.itunes.apple.com, play-edge-cdn.itunes.apple.com
